services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Schmid\Sitepackage\:
    resource: '../Classes/*'

  # Console Commands
  Schmid\Sitepackage\Command\HomepageAboutSectionCommand:
    tags:
      - name: 'console.command'
        command: 'sitepackage:homepage:about-section'
        description: 'One-off, idempotent: wraps homepage "Über uns" 2cols in a bg-muted section, adds section-header + Feuerwehren-Karte plugin, fixes double-container frame_class, sets quick-actions card links'

  Schmid\Sitepackage\Command\DataHandlerApplyCommand:
    tags:
      - name: 'console.command'
        command: 'sitepackage:datahandler:apply'
        description: 'Applies a JSON datamap/cmdmap file via DataHandler (live workspace) and prints the NEW-id mapping'

  Schmid\Sitepackage\Command\SeedPhaseCPagesCommand:
    tags:
      - name: 'console.command'
        command: 'sitepackage:seed:phase-c'
        description: 'One-off, idempotent: seeds content for Ausbildung (58), Downloads (47), Formulare (14) and Kontakt (17) pages'

  Schmid\Sitepackage\Command\SeedPhaseDPagesCommand:
    tags:
      - name: 'console.command'
        command: 'sitepackage:seed:phase-d'
        description: 'One-off, idempotent: Musterseiten Tabs/Slider, Service-Hub (39), Kontakt-Shortcut (63), Einsätze via News-Kategorie (32), Termine-Ergänzung (13)'

  Schmid\Sitepackage\Command\OidcSetupGroupsCommand:
    tags:
      - name: 'console.command'
        command: 'kfv:oidc:setup-groups'
        description: 'Idempotent: legt die FE-Gruppen für IAM-Rollen (Kommandant, Kreisbrandmeister) mit tx_oidc_pattern an'

  Schmid\Sitepackage\Command\OidcLinkUsersCommand:
    tags:
      - name: 'console.command'
        command: 'kfv:oidc:link-users'
        description: 'Verknüpft bestehende fe_users per E-Mail mit der KFV-ID (CSV email,kfv_id aus dem IAM), Default Dry-Run'
