<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:asset.script identifier="indexed_search_pagination" src="EXT:indexed_search/Resources/Public/JavaScript/pagination.js" />

<div class="tx-indexedsearch container py-5">
    <f:alias map="{sword: searchParams.sword}">
        <f:render partial="Form" arguments="{_all}" />
    </f:alias>

    <f:for each="{resultsets}" as="result" key="freeIndexUid">
        <f:if condition="{result.categoryTitle}">
            <h1 class="tx-indexedsearch-category h4 fw-bold mb-3">{result.categoryTitle}</h1>
        </f:if>
        <f:if condition="{result.count} > 0">
            <div class="tx-indexedsearch-info-sword text-body-secondary mb-3">
                <f:for each="{searchWords}" as="searchWord" key="key">
                    <f:if condition="{key} > 0">
                        <f:then>
                            <f:translate key="searchFor.{searchWord.operatorLabel}" />&nbsp;<span class="fw-semibold">{searchWord.sword}</span>
                        </f:then>
                        <f:else>
                            <f:translate key="searchFor" />&nbsp;<span class="fw-semibold">{searchWord.sword}</span>
                        </f:else>
                    </f:if>
                </f:for>
            </div>
        </f:if>
        {result.searchedInSectionInfo}
        <f:if condition="{result.count} > 0">
            <f:then>
                <div class="tx-indexedsearch-browsebox mb-3 small text-body-secondary">
                    <f:sanitize.html>
                        <f:translate key="displayResults" arguments="{0: result.pagination.startRecordNumber, 1: result.pagination.endRecordNumber, 2: result.count}" />
                    </f:sanitize.html>

                    <f:if condition="{result.affectedSections}">
                        <div class="tx-indexedsearch-sectionlinks d-flex flex-wrap gap-2 mt-2">
                            <f:for each="{result.affectedSections}" as="sectionData" key="sectionId">
                                <f:link.page class="badge bg-body-secondary text-body text-decoration-none" section="anchor_{sectionId}" addQueryString="1"
                                                        argumentsToBeExcludedFromQueryString="{0: 'id'}">
                                    <f:if condition="{sectionData.0}">
                                        <f:then>{sectionData.0}</f:then>
                                        <f:else><f:translate key="unnamedSection" /></f:else>
                                    </f:if>
                                    &nbsp;({sectionData.1})
                                </f:link.page>
                            </f:for>
                        </div>
                    </f:if>

                    <f:render partial="Pagination" arguments="{pagination: result.pagination, searchParams: searchParams}" />
                </div>
                <f:for each="{result.rows}" as="row">
                    <f:if condition="{row.isSectionHeader}">
                        <f:then>
                        <div id="anchor_{row.sectionId}" class="tx-indexedsearch-sectionhead mt-4 mb-2">
                            <h2 class="tx-indexedsearch-title h5 fw-bold d-flex align-items-center gap-2">
                                <f:format.html>{row.sectionTitle}</f:format.html>
                                <span class="badge bg-primary-subtle text-primary tx-indexedsearch-result-count">{row.numResultRows} <f:translate key="{f:if(condition: '{row.numResultRows} > 1', then: 'result.pages', else: 'result.page')}" /></span>
                            </h2>
                        </div>
                        </f:then>
                        <f:else>
                            <f:render partial="Searchresult" arguments="{row: row, searchParams: searchParams, firstRow: firstRow}" />
                        </f:else>
                    </f:if>
                </f:for>
                <div class="tx-indexedsearch-browsebox mt-3">
                    <f:render partial="Pagination" arguments="{pagination: result.pagination, searchParams: searchParams, freeIndexUid: freeIndexUid}" />
                </div>
            </f:then>
            <f:else>
                <div class="tx-indexedsearch-info-noresult alert alert-light border d-flex align-items-center gap-3 mt-3">
                    <i class="bi bi-search fs-3 text-body-secondary"></i>
                    <span><f:translate key="result.noResult" /></span>
                </div>
            </f:else>
        </f:if>
    </f:for>
</div>
</html>
