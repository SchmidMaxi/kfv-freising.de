<f:form pageUid="{settings.listPid}" id="calendarizeSearchForm">
    <div class="tx-calendarize-hidden-fields">
        <f:form.hidden
            id="calendarizePage"
            name="currentPage"
            value="1"
        />
    </div>
    <div class="row row-cols-1 row-cols-sm-2 g-3 mb-3">
        <div class="col">
            <label for="calendarizeStartDate" class="form-label">
                <f:translate key="search.start_date" extensionName="Calendarize" />
            </label>
            <f:form.textfield type="date" name="startDate" id="calendarizeStartDate"
                              class="form-control"
                              value="{startDate -> f:format.date(format: 'Y-m-d')}" />
        </div>
        <div class="col">
            <label for="calendarizeEndDate" class="form-label">
                <f:translate key="search.end_date" extensionName="Calendarize" />
            </label>
            <f:form.textfield type="date" name="endDate" id="calendarizeEndDate"
                              class="form-control"
                              value="{endDate -> f:format.date(format: 'Y-m-d')}" />
        </div>
    </div>

    <f:for each="{configurations}" as="configuration">
        <f:render partial="{configuration.partialIdentifier}/Search" arguments="{customSearch: customSearch, extended: extended}" />
    </f:for>

    <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-2">
        <i class="bi bi-search" aria-hidden="true"></i>
        <f:translate key="search.button_label" extensionName="Calendarize" />
    </button>
</f:form>
