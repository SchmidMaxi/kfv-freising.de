<f:form pageUid="{settings.listPid}" id="calendarizeSearchForm">
    <div class="tx-calendarize-hidden-fields">
        <f:form.hidden
            id="calendarizePage"
            name="currentPage"
            value="1"
        />
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
            <label for="calendarizeStartDate" class="block text-sm font-medium text-foreground mb-1">
                <f:translate key="search.start_date" extensionName="Calendarize" />
            </label>
            <f:form.textfield type="date" name="startDate" id="calendarizeStartDate"
                              class="w-full px-3 py-2 rounded-lg border border-border bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-accent/40"
                              value="{startDate -> f:format.date(format: 'Y-m-d')}" />
        </div>
        <div>
            <label for="calendarizeEndDate" class="block text-sm font-medium text-foreground mb-1">
                <f:translate key="search.end_date" extensionName="Calendarize" />
            </label>
            <f:form.textfield type="date" name="endDate" id="calendarizeEndDate"
                              class="w-full px-3 py-2 rounded-lg border border-border bg-background text-foreground text-sm focus:outline-none focus:ring-2 focus:ring-accent/40"
                              value="{endDate -> f:format.date(format: 'Y-m-d')}" />
        </div>
    </div>

    <f:for each="{configurations}" as="configuration">
        <f:render partial="{configuration.partialIdentifier}/Search" arguments="{customSearch: customSearch, extended: extended}" />
    </f:for>

    <button type="submit"
            class="inline-flex items-center gap-2 px-5 py-2 rounded-lg gradient-fire text-white text-sm font-medium hover:opacity-90 transition-opacity">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <f:translate key="search.button_label" extensionName="Calendarize" />
    </button>
</f:form>
