<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:section name="Main">
    <div class="bg-card border border-border rounded-xl p-6 md:p-8 shadow-sm">
        <f:render partial="{index.configuration.partialIdentifier}/Detail" arguments="{index: index}"/>
        <div class="flex flex-wrap gap-3 mt-6 pt-6 border-t border-border">
            <f:if condition="{settings.listPid}">
                <f:link.page pageUid="{settings.listPid}"
                             class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-border text-foreground hover:bg-secondary text-sm font-medium no-underline transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    <f:translate key="back"/>
                </f:link.page>
            </f:if>
            <f:link.action action="detail" arguments="{index: index}" format="ics"
                           class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-border text-foreground hover:bg-secondary text-sm font-medium no-underline transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M12 14v4"/><path d="M10 16h4"/></svg>
                ICS / iCal
            </f:link.action>
        </div>
    </div>
</f:section>
</html>
