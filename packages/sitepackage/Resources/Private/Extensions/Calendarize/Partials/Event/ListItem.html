{namespace c=HDNET\Calendarize\ViewHelpers}

<f:alias map="{event: index.originalObject}">
    <article class="bg-card border border-border rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow state-{index.state}">
        <div class="flex gap-4 p-5">
            <f:for each="{event.images}" as="image" iteration="i">
                <f:if condition="{i.isFirst}">
                    <div class="shrink-0 w-24 h-24 rounded-lg overflow-hidden">
                        <c:link.index index="{index}">
                            <f:if condition="{image.originalResource.type}==4">
                                <f:then>
                                    <f:media file="{image}" class="w-full h-full object-cover" />
                                </f:then>
                                <f:else>
                                    <f:image image="{image}" alt="" maxWidth="160" maxHeight="160" class="w-full h-full object-cover" />
                                </f:else>
                            </f:if>
                        </c:link.index>
                    </div>
                </f:if>
            </f:for>

            <div class="flex-1 min-w-0">
                <h3 class="text-base font-heading font-semibold text-foreground mb-1 leading-snug">
                    <c:link.index index="{index}" class="text-foreground hover:text-accent no-underline transition-colors">
                        <f:render partial="{index.configuration.partialIdentifier}/Title" arguments="{index: index}" />
                    </c:link.index>
                </h3>

                <p class="text-sm text-muted-foreground mb-2">
                    <f:if condition="{index.state}=='canceled'">
                        <f:then>
                            <span class="inline-flex items-center gap-1 text-destructive font-medium">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                                <f:translate key="canceled" />
                            </span>
                        </f:then>
                        <f:else>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mr-1 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                            <f:render partial="DateInformation" arguments="{index: index}"/>
                        </f:else>
                    </f:if>
                </p>

                <p class="text-sm text-muted-foreground line-clamp-2">
                    <f:if condition="{event.abstract}">
                        <f:then>
                            <f:format.nl2br>{event.abstract}</f:format.nl2br>
                        </f:then>
                        <f:else>
                            <f:format.crop maxCharacters="180" append=" …">
                                <f:format.stripTags>{event.description}</f:format.stripTags>
                            </f:format.crop>
                        </f:else>
                    </f:if>
                </p>

                <div class="flex gap-2 mt-3">
                    <f:if condition="{settings.detailPid}">
                        <c:link.index index="{index}"
                                      class="inline-flex items-center gap-1 text-xs font-medium text-accent hover:text-accent/80 transition-colors no-underline">
                            <f:translate key="more"/>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </c:link.index>
                    </f:if>

                    <f:if condition="{settings.bookingPid}">
                        <f:if condition="{event.bookable}">
                            <c:link.booking index="{index}"
                                            class="inline-flex items-center gap-1 text-xs font-medium px-3 py-1 rounded-full gradient-fire text-white hover:opacity-90 transition-opacity no-underline">
                                <f:translate key="booking" />
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                            </c:link.booking>
                        </f:if>
                    </f:if>
                </div>
            </div>
        </div>
    </article>
</f:alias>
