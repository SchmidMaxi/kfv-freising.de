{namespace c=HDNET\Calendarize\ViewHelpers}

<f:alias map="{event: index.originalObject}">
    <c:link.index index="{index}" class="block no-underline">
        <div class="p-4 rounded-lg bg-primary-foreground/10 hover:bg-primary-foreground/15 transition-colors cursor-pointer">
            <p class="font-heading font-medium text-primary-foreground">
                <f:render partial="{index.configuration.partialIdentifier}/Title" arguments="{index: index}" />
            </p>
            <div class="flex items-center gap-2 mt-2 text-sm text-primary-foreground/70">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3 w-3">
                    <path d="M8 2v4"></path>
                    <path d="M16 2v4"></path>
                    <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                    <path d="M3 10h18"></path>
                </svg>
                <span>
                    <f:format.date format="d.m.Y">{index.startDate}</f:format.date>
                    <f:if condition="{index.allDay} == 0">
                        <f:then>, <f:format.date format="H:i">{index.startDateComplete}</f:format.date> Uhr</f:then>
                    </f:if>
                </span>
            </div>
            <f:if condition="{event.location}">
                <p class="text-sm text-primary-foreground/70 mt-1">{event.location}</p>
            </f:if>
        </div>
    </c:link.index>
</f:alias>
