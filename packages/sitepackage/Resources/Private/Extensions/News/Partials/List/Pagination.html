<f:if condition="{pagination.allPageNumbers -> f:count()} > 1">
  <nav class="my-8 flex justify-center" aria-label="Nachrichten Navigation">
    <ul class="flex items-center gap-1 text-sm">

      <f:if condition="{pagination.previousPageNumber} && {pagination.previousPageNumber} >= {pagination.firstPageNumber}">
        <li>
          <a href="{f:uri.action(action:actionName, arguments:{currentPage: pagination.previousPageNumber}, addQueryString:'untrusted')}"
             title="{f:translate(key:'pagination.previous')}"
             class="flex h-9 w-9 items-center justify-center rounded border border-border text-foreground transition-colors hover:bg-muted hover:text-accent">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
      </f:if>

      <f:if condition="{pagination.hasLessPages}">
        <li><span class="flex h-9 w-9 items-center justify-center text-muted-foreground">…</span></li>
      </f:if>

      <f:for each="{pagination.allPageNumbers}" as="page">
        <f:if condition="{page} == {paginator.currentPageNumber}">
          <f:then>
            <li>
              <span class="gradient-fire flex h-9 w-9 items-center justify-center rounded font-semibold text-white"
                    aria-current="page">{page}</span>
            </li>
          </f:then>
          <f:else>
            <li>
              <a class="flex h-9 w-9 items-center justify-center rounded border border-border text-foreground transition-colors hover:bg-muted hover:text-accent"
                 href="{f:uri.action(action:actionName, arguments:{currentPage: page}, addQueryString:'untrusted')}">{page}</a>
            </li>
          </f:else>
        </f:if>
      </f:for>

      <f:if condition="{pagination.hasMorePages}">
        <li><span class="flex h-9 w-9 items-center justify-center text-muted-foreground">…</span></li>
      </f:if>

      <f:if condition="{pagination.nextPageNumber} && {pagination.nextPageNumber} <= {pagination.lastPageNumber}">
        <li>
          <a class="flex h-9 w-9 items-center justify-center rounded border border-border text-foreground transition-colors hover:bg-muted hover:text-accent"
             href="{f:uri.action(action:actionName, arguments:{currentPage: pagination.nextPageNumber}, addQueryString:'untrusted')}"
             title="{f:translate(key:'pagination.next')}">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      </f:if>

    </ul>
  </nav>
</f:if>
