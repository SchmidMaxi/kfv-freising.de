<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">
<figure class="my-4">
  <f:if condition="{mediaElement.link}">
    <f:then>
      <f:link.typolink parameter="{mediaElement.link}" target="{n:targetLink(link:mediaElement.link)}" class="block">
        <f:image image="{mediaElement}" class="max-w-full h-auto rounded"
                 title="{mediaElement.title}" alt="{mediaElement.alternative}"
                 loading="{settings.detail.media.image.lazyLoading}"
                 width="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.detail.media.image.maxWidth)}"
                 height="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.detail.media.image.maxHeight)}"
                 additionalAttributes="{itemprop:'image'}" />
      </f:link.typolink>
    </f:then>
    <f:else>
      <f:if condition="{settings.detail.media.image.lightbox.enabled}">
        <f:then>
          <a href="{f:uri.image(image:mediaElement, width:'{settings.detail.media.image.lightbox.width}', height:'{settings.detail.media.image.lightbox.height}')}"
             title="{mediaElement.title}"
             class="{settings.detail.media.image.lightbox.class} block"
             rel="{settings.detail.media.image.lightbox.rel}">
            <f:image image="{mediaElement}" class="max-w-full h-auto rounded"
                     title="{mediaElement.title}" alt="{mediaElement.alternative}"
                     loading="{settings.detail.media.image.lazyLoading}"
                     width="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.detail.media.image.maxWidth)}"
                     height="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.detail.media.image.maxHeight)}"
                     additionalAttributes="{itemprop:'image'}" />
          </a>
        </f:then>
        <f:else>
          <f:image image="{mediaElement}" class="max-w-full h-auto rounded"
                   title="{mediaElement.title}" alt="{mediaElement.alternative}"
                   loading="{settings.detail.media.image.lazyLoading}"
                   width="{f:if(condition: settings.media.maxWidth, then: settings.media.maxWidth, else: settings.detail.media.image.maxWidth)}"
                   height="{f:if(condition: settings.media.maxHeight, then: settings.media.maxHeight, else: settings.detail.media.image.maxHeight)}"
                   additionalAttributes="{itemprop:'image'}" />
        </f:else>
      </f:if>
    </f:else>
  </f:if>
  <f:if condition="{mediaElement.description}">
    <figcaption class="mt-2 text-sm text-muted-foreground">{mediaElement.description}</figcaption>
  </f:if>
</figure>
</html>
