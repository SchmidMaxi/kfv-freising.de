<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{media}">
    <f:asset.css identifier="splideCss" href="EXT:sitepackage/Resources/Public/Css/splide-core.min.css" />
    <f:asset.script identifier="splideJs" src="EXT:sitepackage/Resources/Public/JavaScript/splide.min.js" />

    <div class="my-5 splide-slider splide" role="group" data-splide='{"perMove":1, "perPage":3, "gap":"2rem", "breakpoints":{"992":{"perPage":2}, "576":{"perPage":1}} }'>
        <div class="splide__track">
            <ul class="splide__list">
                <f:for each="{media}" as="mediaElement">
                    <li class="splide__slide">
                        <f:if condition="{mediaElement.originalResource.type} == 2">
                            <f:render partial="Detail/MediaImage" arguments="{mediaElement: mediaElement, settings:settings}"/>
                        </f:if>
                        <f:if condition="{mediaElement.originalResource.type} == 3">
                            <f:render partial="Detail/MediaVideo" arguments="{mediaElement: mediaElement, settings:settings}"/>
                        </f:if>
                        <f:if condition="{mediaElement.originalResource.type} == 4">
                            <f:render partial="Detail/MediaVideo" arguments="{mediaElement: mediaElement, settings:settings}"/>
                        </f:if>
                        <f:if condition="{mediaElement.originalResource.type} == 5">
                            <f:render partial="Detail/MediaImage" arguments="{mediaElement: mediaElement, settings:settings}"/>
                        </f:if>
                    </li>
                </f:for>
            </ul>
        </div>
    </div>
</f:if>
</html>
