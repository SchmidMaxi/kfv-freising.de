<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<figure class="my-4">
  <div class="rounded overflow-hidden">
    <f:media file="{mediaElement}" class="img-fluid"
             width="{settings.detail.media.video.width}"
             height="{settings.detail.media.video.height}" />
  </div>
  <f:if condition="{mediaElement.description}">
    <figcaption class="mt-2 small text-body-secondary">{mediaElement.description}</figcaption>
  </f:if>
</figure>
</html>
