<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="General" />

<f:section name="content">
    <f:if condition="{search}">
        <f:if condition="{news}">
            <f:then>
                <div class="mb-6 flex items-center justify-between">
                    <p class="text-sm text-muted-foreground">
                        <span class="font-medium text-foreground">{news -> f:count()}</span>
                        <f:if condition="{news -> f:count()} == 1">
                            <f:then> Ergebnis</f:then>
                            <f:else> Ergebnisse</f:else>
                        </f:if>
                        für <span class="font-medium text-foreground">„{search.subject}"</span>
                    </p>
                </div>

                <f:if condition="{settings.search.paginate.insertAbove}">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                </f:if>

                <div class="flex flex-col gap-6">
                    <f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
                        <f:render partial="List/Item" arguments="{newsItem: newsItem, settings:settings, className:className, view:'list'}" />
                    </f:for>
                </div>

                <f:if condition="{settings.search.paginate.insertBelow}">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                </f:if>
            </f:then>
            <f:else>
                <div class="flex flex-col items-center py-16 text-center">
                    <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-muted">
                        <i class="bi bi-search text-2xl text-muted-foreground"></i>
                    </div>
                    <h2 class="mb-3 font-heading text-2xl font-semibold text-foreground">
                        Keine Ergebnisse gefunden
                    </h2>
                    <p class="max-w-md text-muted-foreground">
                        Wir konnten nichts zu „{search.subject}" finden. Versuchen Sie einen anderen Suchbegriff.
                    </p>
                </div>
            </f:else>
        </f:if>
    </f:if>
</f:section>
</html>
