<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="General" />

<f:section name="content">
    <f:if condition="{search}">
        <f:if condition="{news}">
            <f:then>
                <div class="mb-4 d-flex align-items-center justify-content-between">
                    <p class="small text-body-secondary mb-0">
                        <span class="fw-medium text-body">{news -> f:count()}</span>
                        <f:if condition="{news -> f:count()} == 1">
                            <f:then> Ergebnis</f:then>
                            <f:else> Ergebnisse</f:else>
                        </f:if>
                        für <span class="fw-medium text-body">„{search.subject}"</span>
                    </p>
                </div>

                <f:if condition="{settings.search.paginate.insertAbove}">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                </f:if>

                <div class="d-flex flex-column gap-4">
                    <f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
                        <f:render partial="List/Item" arguments="{newsItem: newsItem, settings:settings, className:className, view:'list'}" />
                    </f:for>
                </div>

                <f:if condition="{settings.search.paginate.insertBelow}">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                </f:if>
            </f:then>
            <f:else>
                <div class="d-flex flex-column align-items-center py-5 text-center">
                    <div class="mb-4 d-flex align-items-center justify-content-center rounded-circle bg-body-secondary" style="width: 4rem; height: 4rem;">
                        <i class="bi bi-search fs-3 text-body-secondary"></i>
                    </div>
                    <h2 class="mb-3 fs-3 fw-semibold">
                        Keine Ergebnisse gefunden
                    </h2>
                    <p class="text-body-secondary" style="max-width: 28rem;">
                        Wir konnten nichts zu „{search.subject}" finden. Versuchen Sie einen anderen Suchbegriff.
                    </p>
                </div>
            </f:else>
        </f:if>
    </f:if>
</f:section>
</html>
