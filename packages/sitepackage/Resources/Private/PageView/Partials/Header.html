<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<header class="sticky top-0 z-50 w-full">

    <!-- Preheader: dunkle Top-Bar, nur Desktop -->
    <div id="preheader" class="bg-surface-dark hidden md:block">
        <div class="container py-2">
            <div class="flex justify-between items-center text-sm">
                <div class="flex items-center gap-6">
                    <a href="tel:+49816160033170"
                       class="flex items-center gap-2 text-white/80 hover:text-fire-red-light transition-colors no-underline">
                        <i class="bi bi-telephone-fill text-xs"></i>
                        <span>08161 / 600 33 170</span>
                    </a>
                    <f:link.email email="info@kfv-freising.de"
                                  class="flex items-center gap-2 text-white/80 hover:text-fire-red-light transition-colors no-underline">
                        <i class="bi bi-envelope-fill text-xs"></i>
                        <span>info@kfv-freising.de</span>
                    </f:link.email>
                </div>
                <div class="flex items-center gap-2 text-white">
                    <span class="opacity-60 text-xs uppercase tracking-widest">Notruf</span>
                    <a href="tel:112" class="font-heading font-bold text-fire-red-light text-xl no-underline leading-none">112</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Hauptnavigation -->
    <nav class="bg-background border-b border-border shadow-sm">
        <div class="container flex items-center justify-between h-16 lg:h-20">

            <!-- Logo -->
            <f:link.typolink parameter="/" class="flex items-center gap-3 no-underline shrink-0">
                <f:image src="{settings.Sitepackage.emblem}"
                         alt="Kreisfeuerwehrverband Freising e.V. Logo"
                         width="56"
                         class="h-12 lg:h-14 w-auto" />
                <div class="font-heading text-foreground leading-snug hidden sm:block">
                    <span class="font-semibold text-sm block">Kreisfeuerwehrverband</span>
                    <span class="font-light italic tracking-wide text-xs block">Freising e.V.</span>
                </div>
            </f:link.typolink>

            <!-- Desktop-Navigation (ab lg) -->
            <ul class="hidden lg:flex items-center gap-0.5 list-none m-0 p-0">
                <li>
                    <a href="/"
                       class="inline-flex h-9 items-center px-3 py-2 rounded-md text-foreground hover:bg-secondary hover:text-foreground transition-colors no-underline">
                        <i class="bi bi-house-fill text-sm"></i>
                    </a>
                </li>
                <f:for each="{main}" as="navItem">
                    <f:if condition="!{navItem.children}">
                        <f:then>
                            <li>
                                <a href="{navItem.link}"
                                   class="inline-flex h-9 items-center px-4 py-2 text-sm font-medium rounded-md transition-colors no-underline {f:if(condition: navItem.active, then: 'text-accent font-semibold', else: 'text-foreground hover:bg-secondary')}">
                                    {navItem.title}
                                </a>
                            </li>
                        </f:then>
                        <f:else>
                            <!-- Dropdown via CSS :hover -->
                            <li class="relative group">
                                <div class="flex items-center">
                                    <a href="{navItem.link}"
                                       class="inline-flex h-9 items-center pl-4 pr-2 py-2 text-sm font-medium rounded-l-md transition-colors no-underline {f:if(condition: navItem.active, then: 'text-accent font-semibold', else: 'text-foreground hover:bg-secondary')}">
                                        {navItem.title}
                                    </a>
                                    <span class="inline-flex h-9 items-center pr-2 py-2 rounded-r-md text-foreground cursor-default">
                                        <i class="bi bi-chevron-down text-xs transition-transform duration-200 group-hover:rotate-180"></i>
                                    </span>
                                </div>
                                <!-- Dropdown-Menü -->
                                <ul class="hidden group-hover:block absolute top-full left-0 mt-1 min-w-48 bg-card border border-border rounded-lg shadow-md py-1 z-50 list-none p-0 m-0">
                                    <f:for each="{navItem.children}" as="child">
                                        <f:if condition="!{child.spacer}">
                                            <li>
                                                <a href="{child.link}"
                                                   class="block px-4 py-2 text-sm transition-colors no-underline {f:if(condition: child.active, then: 'text-accent bg-secondary', else: 'text-foreground hover:bg-secondary hover:text-accent')}">
                                                    {child.title}
                                                </a>
                                            </li>
                                        </f:if>
                                    </f:for>
                                </ul>
                            </li>
                        </f:else>
                    </f:if>
                </f:for>
            </ul>

            <!-- Desktop Rechts: Suche + Theme-Toggle -->
            <div class="hidden lg:flex items-center gap-1">
                <!-- Suche -->
                <a href="/suche"
                   class="inline-flex h-9 w-9 items-center justify-center rounded-md text-foreground hover:bg-secondary transition-colors no-underline"
                   aria-label="Suche">
                    <i class="bi bi-search"></i>
                </a>

                <!-- Theme-Toggle (CSS hover Dropdown) -->
                <div id="theme-switch" class="relative group">
                    <button id="bd-theme"
                            class="inline-flex h-9 w-9 items-center justify-center rounded-md text-foreground hover:bg-secondary transition-colors"
                            aria-label="Design-Modus wählen"
                            aria-expanded="false">
                        <svg class="bi theme-icon-active"><use href="#circle-half"></use></svg>
                    </button>
                    <ul class="hidden group-hover:block absolute right-0 top-full mt-1 w-36 bg-card border border-border rounded-lg shadow-md py-1 z-50 list-none p-0 m-0">
                        <li>
                            <button type="button"
                                    class="kfv-theme-btn flex items-center gap-2 w-full px-4 py-2 text-sm text-foreground hover:bg-secondary transition-colors"
                                    data-bs-theme-value="light"
                                    aria-pressed="false">
                                <svg class="bi theme-icon opacity-50"><use href="#sun-fill"></use></svg>
                                Hell
                            </button>
                        </li>
                        <li>
                            <button type="button"
                                    class="kfv-theme-btn flex items-center gap-2 w-full px-4 py-2 text-sm text-foreground hover:bg-secondary transition-colors"
                                    data-bs-theme-value="dark"
                                    aria-pressed="false">
                                <svg class="bi theme-icon opacity-50"><use href="#moon-stars-fill"></use></svg>
                                Dunkel
                            </button>
                        </li>
                        <li>
                            <button type="button"
                                    class="kfv-theme-btn flex items-center gap-2 w-full px-4 py-2 text-sm text-foreground hover:bg-secondary transition-colors"
                                    data-bs-theme-value="auto"
                                    aria-pressed="false">
                                <svg class="bi theme-icon opacity-50"><use href="#circle-half"></use></svg>
                                Auto
                            </button>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Mobile: Hamburger-Button -->
            <button id="mobile-menu-toggle"
                    class="lg:hidden inline-flex items-center justify-center h-10 w-10 rounded-md text-foreground hover:bg-secondary transition-colors"
                    aria-label="Menü öffnen"
                    aria-expanded="false"
                    aria-controls="mobile-menu">
                <i class="bi bi-list text-2xl" id="mobile-menu-icon"></i>
            </button>
        </div>

        <!-- Mobile-Menü -->
        <div id="mobile-menu" class="hidden lg:hidden border-t border-border">
            <ul class="container py-3 space-y-0.5 list-none p-4 m-0">
                <li>
                    <a href="/"
                       class="flex items-center gap-2 px-4 py-3 rounded-md font-medium text-foreground hover:bg-secondary transition-colors no-underline">
                        <i class="bi bi-house-fill text-sm"></i>
                        Startseite
                    </a>
                </li>
                <f:for each="{main}" as="navItem">
                    <li>
                        <f:if condition="!{navItem.children}">
                            <f:then>
                                <a href="{navItem.link}"
                                   class="block px-4 py-3 rounded-md font-medium transition-colors no-underline {f:if(condition: navItem.active, then: 'text-accent bg-secondary', else: 'text-foreground hover:bg-secondary')}">
                                    {navItem.title}
                                </a>
                            </f:then>
                            <f:else>
                                <!-- Mobile Sub-Navigation via <details> (kein JS nötig) -->
                                <details class="group">
                                    <summary class="flex items-center justify-between px-4 py-3 rounded-md font-medium text-foreground hover:bg-secondary cursor-pointer list-none transition-colors">
                                        {navItem.title}
                                        <i class="bi bi-chevron-down text-xs transition-transform duration-200 group-open:rotate-180"></i>
                                    </summary>
                                    <ul class="mt-1 ml-4 pl-4 border-l-2 border-accent space-y-0.5 list-none p-0 m-0">
                                        <f:for each="{navItem.children}" as="child">
                                            <f:if condition="!{child.spacer}">
                                                <li>
                                                    <a href="{child.link}"
                                                       class="block px-4 py-2 text-sm rounded-md transition-colors no-underline {f:if(condition: child.active, then: 'text-accent', else: 'text-muted-foreground hover:text-foreground hover:bg-secondary')}">
                                                        {child.title}
                                                    </a>
                                                </li>
                                            </f:if>
                                        </f:for>
                                    </ul>
                                </details>
                            </f:else>
                        </f:if>
                    </li>
                </f:for>
                <!-- Mobile: Theme-Buttons -->
                <li class="pt-4 border-t border-border mt-4">
                    <p class="px-4 text-xs text-muted-foreground uppercase tracking-widest mb-2">Design-Modus</p>
                    <div class="flex gap-2 px-4">
                        <button type="button"
                                class="kfv-theme-btn flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-md text-sm font-medium border border-border text-foreground hover:bg-secondary transition-colors"
                                data-bs-theme-value="light" aria-pressed="false">
                            <i class="bi bi-sun-fill text-xs"></i> Hell
                        </button>
                        <button type="button"
                                class="kfv-theme-btn flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-md text-sm font-medium border border-border text-foreground hover:bg-secondary transition-colors"
                                data-bs-theme-value="dark" aria-pressed="false">
                            <i class="bi bi-moon-stars-fill text-xs"></i> Dunkel
                        </button>
                        <button type="button"
                                class="kfv-theme-btn flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded-md text-sm font-medium border border-border text-foreground hover:bg-secondary transition-colors"
                                data-bs-theme-value="auto" aria-pressed="false">
                            <i class="bi bi-circle-half text-xs"></i> Auto
                        </button>
                    </div>
                </li>
            </ul>
        </div>
    </nav>
</header>

<!-- SVG-Sprites für Theme-Icons (versteckt) -->

    </symbol>
</svg>

</html>
