<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<footer class="bg-surface-dark">

    <!-- Haupt-Footer -->
    <div class="container py-14 lg:py-16">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 lg:gap-12">

            <!-- Marken-Spalte -->
            <div>
                <div class="flex items-center gap-3 mb-5">
                    <img src="{f:uri.image(src: settings.Sitepackage.logoInverse)}"
                         alt="Kreisfeuerwehrverband Freising e.V. Logo"
                         class="h-14 w-auto" />
                </div>
                <p class="text-white/60 text-sm leading-relaxed mb-6">
                    Gemeinsam für Ihre Sicherheit im Landkreis Freising.
                    Rund um die Uhr im Einsatz.
                </p>
                <!-- Social Icons -->
                <div class="flex gap-3" id="social">
                    <f:link.external uri="https://www.facebook.com/kbifs/"
                                     class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-white/10 text-white hover:bg-accent transition-colors"
                                     title="Facebook"
                                     target="_blank" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
                        </svg>
                    </f:link.external>
                    <f:link.external uri="https://www.instagram.com/kreisbrandinspektionfreising/"
                                     class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-white/10 text-white hover:bg-accent transition-colors"
                                     title="Instagram"
                                     target="_blank" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37zm1.5-4.87h.01"/>
                        </svg>
                    </f:link.external>
                    <f:link.external uri="https://www.youtube.com/@kreisbrandinspektionfreising"
                                     class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-white/10 text-white hover:bg-accent transition-colors"
                                     title="YouTube"
                                     target="_blank" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/>
                            <path d="m10 15 5-3-5-3z"/>
                        </svg>
                    </f:link.external>
                </div>
            </div>

            <!-- Dynamische Navigations-Spalten aus TYPO3 -->
            <f:for each="{footer}" as="footerItem">
                <div>
                    <h3 class="font-heading font-semibold text-white text-base mb-5">{footerItem.title}</h3>
                    <f:if condition="{footerItem.children}">
                        <ul class="space-y-2.5 list-none p-0 m-0">
                            <f:for each="{footerItem.children}" as="child">
                                <li>
                                    <f:link.typolink parameter="{child.link}"
                                                     class="text-white/60 hover:text-accent transition-colors text-sm no-underline">
                                        {child.title}
                                    </f:link.typolink>
                                </li>
                            </f:for>
                        </ul>
                    </f:if>
                </div>
            </f:for>

            <!-- Kontakt-Spalte -->
            <div>
                <h3 class="font-heading font-semibold text-white text-base mb-5">Kontakt</h3>
                <ul class="space-y-4 list-none p-0 m-0">
                    <li class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 mt-0.5 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                        <span class="text-white/60 text-sm leading-relaxed">
                            {settings.Sitepackage.address -> f:format.raw()}
                        </span>
                    </li>
                    <li>
                        <f:link.external uri="tel:{settings.Sitepackage.phone}"
                                         class="flex items-center gap-3 text-white/60 hover:text-accent transition-colors text-sm no-underline">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12.1a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.8 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.29 6.29l1.02-1.04a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            <span>{settings.Sitepackage.phone}</span>
                        </f:link.external>
                    </li>
                    <li>
                        <f:link.email email="{settings.Sitepackage.email}"
                                      class="flex items-center gap-3 text-white/60 hover:text-accent transition-colors text-sm no-underline">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                            <span>{settings.Sitepackage.email}</span>
                        </f:link.email>
                    </li>
                </ul>
            </div>

        </div>
    </div>

    <!-- Untere Leiste -->
    <div class="border-t border-white/10">
        <div id="meta" class="container py-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-sm text-white/40 order-2 md:order-1">
                <f:cObject typoscriptObjectPath="lib.copyright" />
            </div>
            <ul class="flex flex-wrap justify-center gap-1 list-none p-0 m-0 order-1 md:order-2">
                <f:for each="{meta}" as="navItem" iteration="i">
                    <li>
                        <a href="{navItem.link}"
                           class="px-3 py-1 text-sm text-white/40 hover:text-white transition-colors no-underline {f:if(condition: navItem.active, then: 'text-white/70')}">
                            {navItem.title}
                        </a>
                    </li>
                </f:for>
            </ul>
        </div>
    </div>

</footer>

</html>
