<section id="c{data.uid}" class="section frame frame-{data.frame_class}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')} {data.color}{f:if(condition: '{data.color} == bg-surface-dark', then: ' text-surface-dark-foreground')}">
  <f:if condition="{files}">
    <f:then>
      <div class="container py-16 md:py-24">
        <div class="flex flex-wrap gap-8 items-center">
          <div class="w-full lg:w-1/2">
            <f:for each="{children_200}" as="record">
              <f:format.raw>
                {record.renderedContent}
              </f:format.raw>
            </f:for>
          </div>
          <div class="w-full lg:w-1/2">
            <div class="overflow-hidden rounded-lg">
              <f:image image="{files.0}" class="w-full h-auto object-cover" maxWidth="800" loading="{settings.media.lazyLoading}" />
            </div>
          </div>
        </div>
      </div>
    </f:then>
    <f:else>
      <div class="container py-16 md:py-24">
        <f:for each="{children_200}" as="record">
          <f:format.raw>
            {record.renderedContent}
          </f:format.raw>
        </f:for>
      </div>
    </f:else>
  </f:if>
</section>
