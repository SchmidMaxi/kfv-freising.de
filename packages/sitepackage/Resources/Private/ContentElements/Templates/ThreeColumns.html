<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:vhs="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers" >
<f:layout name="Default" />
    <f:section name="Main">
        <div class="row {flexFormData.align_items} {flexFormData.gutter_x} {flexFormData.gutter_y}">
            <div class="{flexFormData.width_column_xs_1} {flexFormData.width_column_sm_1} {flexFormData.width_column_md_1} {flexFormData.width_column_lg_1} {flexFormData.width_column_xl_1} {flexFormData.width_column_xxl_1} {flexFormData.add_column_1}">
                <f:for each="{children_200}" as="record">
                    <f:format.raw>
                        {record.renderedContent}
                    </f:format.raw>
                </f:for>
            </div>
            <div class="{flexFormData.width_column_xs_2} {flexFormData.width_column_sm_2} {flexFormData.width_column_md_2} {flexFormData.width_column_lg_2} {flexFormData.width_column_xl_2} {flexFormData.width_column_xxl_2} {flexFormData.add_column_2}">
                <f:for each="{children_201}" as="record">
                    <f:format.raw>
                        {record.renderedContent}
                    </f:format.raw>
                </f:for>
            </div>
            <div class="{flexFormData.width_column_xs_3} {flexFormData.width_column_sm_3} {flexFormData.width_column_md_3} {flexFormData.width_column_lg_3} {flexFormData.width_column_xl_3} {flexFormData.width_column_xxl_3} {flexFormData.add_column_3}">
                <f:for each="{children_202}" as="record">
                    <f:format.raw>
                        {record.renderedContent}
                    </f:format.raw>
                </f:for>
            </div>
        </div>
    </f:section>
</html>
