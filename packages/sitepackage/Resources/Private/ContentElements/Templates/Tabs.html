<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">

<f:variable name="tabsLayout" value="{flexFormData.tabs_layout}" />
<f:variable name="uid" value="{data.uid}" />

<!-- Tab-Daten aufbereiten -->
<f:variable name="tabs" value="{
  0: {title: flexFormData.tab_1_title, icon: flexFormData.tab_1_icon, badge: flexFormData.tab_1_badge, children: children_210},
  1: {title: flexFormData.tab_2_title, icon: flexFormData.tab_2_icon, badge: flexFormData.tab_2_badge, children: children_211},
  2: {title: flexFormData.tab_3_title, icon: flexFormData.tab_3_icon, badge: flexFormData.tab_3_badge, children: children_212},
  3: {title: flexFormData.tab_4_title, icon: flexFormData.tab_4_icon, badge: flexFormData.tab_4_badge, children: children_213}
}" />

<div id="c{uid}" class="container my-8" data-tabs="{uid}" data-tabs-layout="{tabsLayout}">

  <f:switch expression="{tabsLayout}">

    <!-- Variante 1: Standard mit Icons -->
    <f:case value="standard">
      <div class="space-y-6">
        <div class="flex gap-1 bg-muted rounded-lg p-1 w-fit" role="tablist">
          <f:for each="{tabs}" as="tab" iteration="i">
            <f:if condition="{tab.title}">
              <button
                role="tab"
                data-tab-target="{uid}-panel-{i.cycle}"
                data-tab-group="{uid}"
                class="tabs-trigger flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-md transition-all {f:if(condition: i.isFirst, then: 'bg-card text-foreground shadow-sm', else: 'text-muted-foreground hover:text-foreground')}"
                aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}"
              >
                <f:if condition="{tab.icon}">
                  <i class="bi bi-{tab.icon} text-sm"></i>
                </f:if>
                {tab.title}
              </button>
            </f:if>
          </f:for>
        </div>
        <f:for each="{tabs}" as="tab" iteration="i">
          <f:if condition="{tab.title}">
            <div
              id="{uid}-panel-{i.cycle}"
              role="tabpanel"
              data-tab-panel="{uid}"
              class="{f:if(condition: i.isFirst, then: '', else: 'hidden')}"
            >
              <f:for each="{tab.children}" as="record">
                <f:format.raw>{record.renderedContent}</f:format.raw>
              </f:for>
            </div>
          </f:if>
        </f:for>
      </div>
    </f:case>

    <!-- Variante 2: Fullwidth -->
    <f:case value="fullwidth">
      <div class="space-y-6">
        <div class="flex bg-muted rounded-lg p-1 w-full" role="tablist">
          <f:for each="{tabs}" as="tab" iteration="i">
            <f:if condition="{tab.title}">
              <button
                role="tab"
                data-tab-target="{uid}-panel-{i.cycle}"
                data-tab-group="{uid}"
                class="tabs-trigger flex-1 px-4 py-2 text-sm font-medium rounded-md transition-all {f:if(condition: i.isFirst, then: 'bg-card text-foreground shadow-sm', else: 'text-muted-foreground hover:text-foreground')}"
                aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}"
              >
                {tab.title}
              </button>
            </f:if>
          </f:for>
        </div>
        <f:for each="{tabs}" as="tab" iteration="i">
          <f:if condition="{tab.title}">
            <div
              id="{uid}-panel-{i.cycle}"
              role="tabpanel"
              data-tab-panel="{uid}"
              class="{f:if(condition: i.isFirst, then: '', else: 'hidden')}"
            >
              <f:for each="{tab.children}" as="record">
                <f:format.raw>{record.renderedContent}</f:format.raw>
              </f:for>
            </div>
          </f:if>
        </f:for>
      </div>
    </f:case>

    <!-- Variante 3: Pills -->
    <f:case value="pills">
      <div class="space-y-6">
        <div class="flex flex-wrap gap-2" role="tablist">
          <f:for each="{tabs}" as="tab" iteration="i">
            <f:if condition="{tab.title}">
              <button
                role="tab"
                data-tab-target="{uid}-panel-{i.cycle}"
                data-tab-group="{uid}"
                class="tabs-trigger inline-flex items-center gap-2 rounded-full px-4 py-2 text-sm font-medium border border-border transition-all {f:if(condition: i.isFirst, then: 'bg-primary text-primary-foreground border-primary', else: 'bg-transparent text-foreground hover:bg-muted')}"
                aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}"
              >
                <f:if condition="{tab.icon}">
                  <i class="bi bi-{tab.icon} text-sm"></i>
                </f:if>
                {tab.title}
                <f:if condition="{tab.badge}">
                  <span class="inline-flex items-center justify-center text-xs font-semibold rounded-full px-1.5 min-w-[1.25rem] h-5 bg-primary/20">{tab.badge}</span>
                </f:if>
              </button>
            </f:if>
          </f:for>
        </div>
        <f:for each="{tabs}" as="tab" iteration="i">
          <f:if condition="{tab.title}">
            <div
              id="{uid}-panel-{i.cycle}"
              role="tabpanel"
              data-tab-panel="{uid}"
              class="{f:if(condition: i.isFirst, then: '', else: 'hidden')}"
            >
              <f:for each="{tab.children}" as="record">
                <f:format.raw>{record.renderedContent}</f:format.raw>
              </f:for>
            </div>
          </f:if>
        </f:for>
      </div>
    </f:case>

    <!-- Variante 4: Vertikal -->
    <f:case value="vertical">
      <div class="flex gap-6">
        <div class="flex flex-col bg-muted rounded-lg p-1 min-w-[200px] h-fit" role="tablist">
          <f:for each="{tabs}" as="tab" iteration="i">
            <f:if condition="{tab.title}">
              <button
                role="tab"
                data-tab-target="{uid}-panel-{i.cycle}"
                data-tab-group="{uid}"
                class="tabs-trigger flex items-center gap-2 w-full text-left px-4 py-2.5 text-sm font-medium rounded-md transition-all {f:if(condition: i.isFirst, then: 'bg-card text-foreground shadow-sm', else: 'text-muted-foreground hover:text-foreground')}"
                aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}"
              >
                <f:if condition="{tab.icon}">
                  <i class="bi bi-{tab.icon} text-sm"></i>
                </f:if>
                {tab.title}
              </button>
            </f:if>
          </f:for>
        </div>
        <div class="flex-1">
          <f:for each="{tabs}" as="tab" iteration="i">
            <f:if condition="{tab.title}">
              <div
                id="{uid}-panel-{i.cycle}"
                role="tabpanel"
                data-tab-panel="{uid}"
                class="{f:if(condition: i.isFirst, then: '', else: 'hidden')}"
              >
                <f:for each="{tab.children}" as="record">
                  <f:format.raw>{record.renderedContent}</f:format.raw>
                </f:for>
              </div>
            </f:if>
          </f:for>
        </div>
      </div>
    </f:case>

    <!-- Fallback: Standard -->
    <f:defaultCase>
      <div class="space-y-6">
        <div class="flex gap-1 bg-muted rounded-lg p-1 w-fit" role="tablist">
          <f:for each="{tabs}" as="tab" iteration="i">
            <f:if condition="{tab.title}">
              <button
                role="tab"
                data-tab-target="{uid}-panel-{i.cycle}"
                data-tab-group="{uid}"
                class="tabs-trigger flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-md transition-all {f:if(condition: i.isFirst, then: 'bg-card text-foreground shadow-sm', else: 'text-muted-foreground hover:text-foreground')}"
                aria-selected="{f:if(condition: i.isFirst, then: 'true', else: 'false')}"
              >
                <f:if condition="{tab.icon}">
                  <i class="bi bi-{tab.icon} text-sm"></i>
                </f:if>
                {tab.title}
              </button>
            </f:if>
          </f:for>
        </div>
        <f:for each="{tabs}" as="tab" iteration="i">
          <f:if condition="{tab.title}">
            <div
              id="{uid}-panel-{i.cycle}"
              role="tabpanel"
              data-tab-panel="{uid}"
              class="{f:if(condition: i.isFirst, then: '', else: 'hidden')}"
            >
              <f:for each="{tab.children}" as="record">
                <f:format.raw>{record.renderedContent}</f:format.raw>
              </f:for>
            </div>
          </f:if>
        </f:for>
      </div>
    </f:defaultCase>

  </f:switch>

</div>

</f:section>
</html>
