<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{compact}">
    <f:then>
        <div class="vstack gap-2">
            <f:if condition="{events -> f:count()} == 0">
                <p class="text-body-secondary mb-0">Keine anstehenden Termine.</p>
            </f:if>
            <f:for each="{events}" as="event">
                <div class="d-flex align-items-center gap-3 p-2 rounded border">
                    <span class="badge bg-secondary text-secondary-foreground flex-shrink-0">
                        <f:format.date format="d.m.Y">{event.startDate}</f:format.date>
                    </span>
                    <div class="flex-grow-1">
                        <div class="fw-medium">{event.originalObject.title}</div>
                        <f:if condition="{event.originalObject.location}">
                            <div class="small text-body-secondary">{event.originalObject.location}</div>
                        </f:if>
                    </div>
                </div>
            </f:for>
        </div>
    </f:then>
    <f:else>
        <div class="vstack gap-2">
            <f:if condition="{events -> f:count()} == 0">
                <p class="text-body-secondary mb-0">Keine anstehenden Termine.</p>
            </f:if>
            <f:for each="{events}" as="event">
                <div class="card border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="text-center flex-shrink-0" style="width:3.5rem">
                            <div class="small text-uppercase text-body-secondary">
                                <f:format.date format="M">{event.startDate}</f:format.date>
                            </div>
                            <div class="fs-4 fw-bold">
                                <f:format.date format="d">{event.startDate}</f:format.date>
                            </div>
                        </div>
                        <div class="flex-grow-1">
                            <h3 class="h6 fw-semibold mb-1">{event.originalObject.title}</h3>
                            <f:if condition="{event.originalObject.location}">
                                <p class="small text-body-secondary mb-0">{event.originalObject.location}</p>
                            </f:if>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:else>
</f:if>

</html>
