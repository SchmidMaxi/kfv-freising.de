<div id="c{data.uid}" class="container my-8">
  <f:if condition="{data.header}">
    <h2 class="mb-6 font-heading text-2xl font-bold text-foreground">{data.header}</h2>
  </f:if>

  <f:switch expression="{data.accordion_layout}">

    <!-- Variante 1: Card-Style (FAQ) -->
    <f:case value="card">
      <div class="max-w-3xl space-y-4">
        <f:for each="{data.items}" as="item" iteration="i">
          <details class="group bg-card rounded-xl border border-border px-6 {f:if(condition: i.isFirst, then: 'open')}">
            <summary class="flex cursor-pointer select-none items-center justify-between py-4 font-heading font-semibold text-card-foreground hover:text-fire-red transition-colors duration-150 list-none">
              <span>{item.title}</span>
              <i class="bi bi-chevron-down ml-4 shrink-0 text-muted-foreground transition-transform duration-200 group-open:rotate-180"></i>
            </summary>
            <div class="border-t border-border pb-5 pt-3 text-muted-foreground leading-relaxed">
              {item.bodytext->f:format.html()}
            </div>
          </details>
        </f:for>
      </div>
    </f:case>

    <!-- Variante 2: Minimalistisch -->
    <f:case value="minimal">
      <div class="max-w-3xl divide-y divide-border overflow-hidden">
        <f:for each="{data.items}" as="item" iteration="i">
          <details class="group" {f:if(condition: i.isFirst, then: 'open')}>
            <summary class="flex cursor-pointer select-none items-center justify-between py-4 font-semibold text-foreground hover:text-primary transition-colors duration-150 list-none">
              <span>{item.title}</span>
              <i class="bi bi-chevron-down ml-4 shrink-0 text-muted-foreground transition-transform duration-200 group-open:rotate-180"></i>
            </summary>
            <div class="pb-4 text-muted-foreground leading-relaxed">
              {item.bodytext->f:format.html()}
            </div>
          </details>
        </f:for>
      </div>
    </f:case>

    <!-- Variante 3: Mit Icons & Badges -->
    <f:case value="icon-badge">
      <div class="max-w-3xl space-y-3">
        <f:for each="{data.items}" as="item" iteration="i">
          <details class="group bg-card rounded-xl border border-border px-6 {f:if(condition: i.isFirst, then: 'open')}">
            <summary class="flex cursor-pointer select-none items-center gap-3 py-4 text-card-foreground hover:text-primary transition-colors duration-150 list-none">
              <i class="bi bi-{item.icon} h-5 w-5 shrink-0 text-xl {f:if(condition: '{item.icon_color} == red', then: 'text-fire-red', else: {f:if(condition: '{item.icon_color} == green', then: 'text-emerald-500', else: {f:if(condition: '{item.icon_color} == amber', then: 'text-amber-500', else: 'text-blue-500')})})}"></i>
              <span class="font-heading font-semibold flex-1">{item.title}</span>
              <f:if condition="{item.badge}">
                <span class="hidden sm:inline-flex text-xs font-semibold border border-border rounded-full px-3 py-0.5 text-muted-foreground mr-2">{item.badge}</span>
              </f:if>
              <i class="bi bi-chevron-down shrink-0 text-muted-foreground transition-transform duration-200 group-open:rotate-180"></i>
            </summary>
            <div class="border-t border-border pb-5 pt-3 pl-8 text-muted-foreground leading-relaxed">
              {item.bodytext->f:format.html()}
            </div>
          </details>
        </f:for>
      </div>
    </f:case>

    <!-- Variante 4: Gruppiert in Karten -->
    <f:case value="grouped">
      <div class="grid md:grid-cols-2 gap-6">
        <f:for each="{data.groups}" as="group">
          <div class="bg-card border border-border rounded-lg p-6">
            <f:if condition="{group.group_title}">
              <h3 class="font-heading font-semibold text-lg text-card-foreground mb-4">{group.group_title}</h3>
            </f:if>
            <div class="divide-y divide-border">
              <f:for each="{group.group_items}" as="item">
                <details class="group">
                  <summary class="flex cursor-pointer select-none items-center justify-between py-3 text-sm font-semibold text-card-foreground hover:text-primary transition-colors duration-150 list-none">
                    <span>{item.title}</span>
                    <i class="bi bi-chevron-down ml-3 shrink-0 text-muted-foreground transition-transform duration-200 group-open:rotate-180"></i>
                  </summary>
                  <div class="pb-3 text-sm text-muted-foreground leading-relaxed">
                    {item.bodytext->f:format.html()}
                  </div>
                </details>
              </f:for>
            </div>
          </div>
        </f:for>
      </div>
    </f:case>

  </f:switch>
</div>
