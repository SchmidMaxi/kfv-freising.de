<div id="c{data.uid}" class="container accordion frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
  <f:for each="{data.items}" as="item" iteration="i">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button{f:if(condition:i.isFirst, else:' collapsed')}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{item.uid}" aria-expanded="{f:if(condition:i.isFirst, then:'true', else:'false')}" aria-controls="collapse{item.uid}">
          {item.title}
        </button>
      </h2>
      <div id="collapse{item.uid}" class="accordion-collapse collapse{f:if(condition:i.isFirst, then:' show')}" data-bs-parent="#c{data.uid}">
        <div class="accordion-body">
          {item.bodytext->f:format.html()}
        </div>
      </div>
    </div>
  </f:for>
</div>
