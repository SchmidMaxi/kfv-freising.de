<div id="c{data.uid}" class="container my-8">
  <f:if condition="{data.header}">
    <h2 class="mb-6 font-heading text-2xl font-bold text-foreground">{data.header}</h2>
  </f:if>
  <div class="divide-y divide-border overflow-hidden rounded-lg border border-border">
    <f:for each="{data.items}" as="item" iteration="i">
      <details class="group bg-card" {f:if(condition: i.isFirst, then: 'open')}>
        <summary class="flex cursor-pointer select-none items-center justify-between px-5 py-4 font-semibold text-foreground transition-colors duration-150 hover:bg-muted">
          <span>{item.title}</span>
          <i class="bi bi-chevron-down ml-4 shrink-0 text-muted-foreground transition-transform duration-200 group-open:rotate-180"></i>
        </summary>
        <div class="border-t border-border bg-card px-5 pb-5 pt-3 text-foreground">
          {item.bodytext->f:format.html()}
        </div>
      </details>
    </f:for>
  </div>
</div>
