<div id="c{data.uid}" class="container my-8">
  <div class="card-color-{data.color} overflow-hidden rounded-lg border border-border shadow transition-shadow duration-200 hover:shadow-md">
    <f:if condition="{data.image}">
      <f:image image="{data.image.0}" class="h-52 w-full object-cover" />
    </f:if>
    <div class="p-6">
      <f:if condition="{data.header}">
        <h4 class="mb-3 font-heading text-xl font-bold">{data.header}</h4>
      </f:if>
      <div>{data.bodytext->f:format.html()}</div>
    </div>
  </div>
</div>
