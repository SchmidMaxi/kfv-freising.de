<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div id="c{data.uid}" class="vstack gap-4 frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
    <f:for each="{data.features}" as="item">
        <div class="d-flex align-items-start gap-3">
            <div class="p-2 rounded-3 bg-primary bg-opacity-10 flex-shrink-0">
                <i class="bi bi-{item.icon} text-primary fs-4"></i>
            </div>
            <div>
                <h3 class="h5 mb-1">{item.title}</h3>
                <p class="text-muted mb-0">{item.description}</p>
            </div>
        </div>
    </f:for>
</div>

</html>
