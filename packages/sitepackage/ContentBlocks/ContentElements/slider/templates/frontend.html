<f:asset.css identifier="sliderSplideCss" href="{cb:assetPath()}/splide-core.min.css"/>

<div id="c{data.uid}" class="my-8">
  <f:if condition="{data.header}">
    <div class="container mb-6">
      <h2 class="font-heading text-2xl font-bold text-foreground">{data.header}</h2>
    </div>
  </f:if>

  <f:switch expression="{data.slider_layout}">

    <!-- Variante 1: News-Slider -->
    <f:case value="news">
      <div class="container">
        <div class="splide splide-slider px-10"
             data-splide='{"type":"loop","perPage":3,"perMove":1,"gap":"1.5rem","breakpoints":{"1024":{"perPage":2},"640":{"perPage":1}}}'>
          <div class="splide__track">
            <ul class="splide__list">
              <f:for each="{data.items}" as="item">
                <li class="splide__slide">
                  <f:link.typolink parameter="{item.link}" class="group block no-underline h-full">
                    <div class="overflow-hidden rounded-lg border border-border bg-card shadow transition-shadow hover:shadow-md h-full flex flex-col">
                      <f:if condition="{item.image}">
                        <div class="aspect-video overflow-hidden">
                          <f:image image="{item.image.0}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        </div>
                      </f:if>
                      <div class="p-4 flex flex-col flex-1">
                        <f:if condition="{item.category}">
                          <span class="inline-block gradient-fire text-white text-xs font-semibold rounded-full px-3 py-1 mb-2 w-fit">{item.category}</span>
                        </f:if>
                        <h3 class="font-heading font-semibold text-card-foreground leading-snug">{item.header}</h3>
                      </div>
                    </div>
                  </f:link.typolink>
                </li>
              </f:for>
            </ul>
          </div>
        </div>
      </div>
    </f:case>

    <!-- Variante 2: Hero-Slider -->
    <f:case value="hero">
      <div class="splide splide-slider"
           data-splide='{"type":"loop","perPage":1,"perMove":1}'>
        <div class="splide__track">
          <ul class="splide__list">
            <f:for each="{data.items}" as="item">
              <li class="splide__slide">
                <div class="relative aspect-[21/9] overflow-hidden">
                  <f:if condition="{item.image}">
                    <f:image image="{item.image.0}" class="w-full h-full object-cover" />
                  </f:if>
                  <div class="absolute inset-0 bg-gradient-to-t from-charcoal-dark/80 via-charcoal-dark/20 to-transparent"></div>
                  <div class="absolute bottom-0 left-0 p-8 md:p-12">
                    <f:if condition="{item.category}">
                      <span class="inline-block gradient-fire text-white text-xs font-semibold rounded-full px-3 py-1 mb-3">{item.category}</span>
                    </f:if>
                    <h3 class="font-heading text-2xl md:text-3xl font-bold text-white mb-3">{item.header}</h3>
                    <f:if condition="{item.link}">
                      <f:link.typolink parameter="{item.link}" class="inline-flex items-center gap-2 bg-white text-primary font-semibold text-sm px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">
                        {f:if(condition: item.button_label, then: item.button_label, else: 'Mehr erfahren')}
                        <i class="bi bi-arrow-right"></i>
                      </f:link.typolink>
                    </f:if>
                  </div>
                </div>
              </li>
            </f:for>
          </ul>
        </div>
      </div>
    </f:case>

    <!-- Variante 3: Zitate-Slider -->
    <f:case value="quote">
      <div class="container">
        <div class="splide splide-slider max-w-2xl mx-auto px-10"
             data-splide='{"type":"loop","perPage":1,"perMove":1,"autoplay":true,"interval":6000,"pauseOnHover":true}'>
          <div class="splide__track">
            <ul class="splide__list">
              <f:for each="{data.items}" as="item">
                <li class="splide__slide">
                  <div class="text-center py-12 px-6">
                    <div class="text-6xl text-fire-red font-heading leading-none mb-4">"</div>
                    <blockquote class="font-heading text-xl md:text-2xl text-foreground italic leading-relaxed mb-6">
                      {item.quote_text}
                    </blockquote>
                    <f:if condition="{item.author}">
                      <p class="text-muted-foreground font-medium">— {item.author}</p>
                    </f:if>
                  </div>
                </li>
              </f:for>
            </ul>
          </div>
        </div>
      </div>
    </f:case>

    <!-- Variante 4: Logo-Band -->
    <f:case value="logo">
      <div class="container">
        <div class="splide splide-slider px-10"
             data-splide='{"type":"slide","perPage":6,"perMove":1,"gap":"1rem","rewind":true,"breakpoints":{"1024":{"perPage":4},"640":{"perPage":3}}}'>
          <div class="splide__track">
            <ul class="splide__list">
              <f:for each="{data.items}" as="item">
                <li class="splide__slide">
                  <f:link.typolink parameter="{item.link}" class="block">
                    <div class="bg-muted rounded-lg aspect-[3/2] flex items-center justify-center border border-border hover:border-primary/30 transition-colors overflow-hidden p-3">
                      <f:if condition="{item.image}">
                        <f:image image="{item.image.0}" class="max-h-full max-w-full object-contain" />
                        <f:else>
                          <span class="text-muted-foreground text-sm font-medium text-center">{item.header}</span>
                        </f:else>
                      </f:if>
                    </div>
                  </f:link.typolink>
                </li>
              </f:for>
            </ul>
          </div>
        </div>
      </div>
    </f:case>

  </f:switch>
</div>
