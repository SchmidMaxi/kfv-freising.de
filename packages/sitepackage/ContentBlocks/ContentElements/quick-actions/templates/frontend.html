<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<style>
    .qa-card { transition: transform .3s ease, box-shadow .3s ease; }
    .qa-card:hover { transform: translateY(-4px); box-shadow: var(--bs-box-shadow) !important; }
</style>

<section id="c{data.uid}" class="py-5 bg-body-secondary frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
    <div class="container">

        <f:if condition="{data.header}">
            <h2 class="text-center mb-5">{data.header}</h2>
        </f:if>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-4">
            <f:for each="{data.items}" as="item">
                <div class="col">
                    <f:link.typolink parameter="{item.link}" class="text-decoration-none d-block h-100">
                        <div class="card h-100 shadow-sm qa-card">
                            <div class="card-body d-flex flex-column">
                                <div class="rounded-3 d-inline-flex align-items-center justify-content-center mb-3 {f:if(condition: '{item.variant} == accent', then: 'gradient-fire', else: 'bg-surface-dark')}" style="width: 3.5rem; height: 3.5rem;">
                                    <f:render partial="Icon" arguments="{icon: item.icon, class: 'text-white fs-4'}" />
                                </div>
                                <h3 class="h5 card-title">{item.title}</h3>
                                <p class="text-muted small mb-0">{item.description}</p>
                            </div>
                        </div>
                    </f:link.typolink>
                </div>
            </f:for>
        </div>

    </div>
</section>

</html>
