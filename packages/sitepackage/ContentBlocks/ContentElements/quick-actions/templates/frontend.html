<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section id="c{data.uid}" class="py-16 bg-secondary frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
    <div class="container">

        <f:if condition="{data.header}">
            <h2 class="font-heading text-3xl font-bold text-foreground mb-10 text-center">{data.header}</h2>
        </f:if>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <f:for each="{data.items}" as="item">
                <f:link.typolink parameter="{item.link}" class="group block no-underline">
                    <div class="h-full bg-card rounded-lg shadow-md hover:shadow-xl transition-all duration-300 group-hover:-translate-y-1 overflow-hidden p-6 flex flex-col">
                        <div class="w-14 h-14 rounded-lg flex items-center justify-center mb-4 group-hover:scale-110 transition-transform shrink-0 {f:if(condition: '{item.variant} == accent', then: 'gradient-fire', else: 'bg-primary')}">
                            <i class="bi bi-{item.icon} text-2xl text-white"></i>
                        </div>
                        <h3 class="font-heading font-semibold text-xl text-card-foreground mb-2">{item.title}</h3>
                        <p class="text-muted-foreground text-sm leading-relaxed">{item.description}</p>
                    </div>
                </f:link.typolink>
            </f:for>
        </div>

    </div>
</section>

</html>
