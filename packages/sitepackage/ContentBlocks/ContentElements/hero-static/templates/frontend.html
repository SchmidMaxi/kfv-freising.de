<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section id="c{data.uid}" class="relative min-h-[600px] md:min-h-[700px] flex items-center overflow-hidden frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">

    <!-- Background: Bild mit Farbverlauf-Overlay, sonst reiner Gradient -->
    <f:if condition="{data.image}">
        <f:then>
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
                 style="background-image: linear-gradient(135deg, hsl(0 100% 25% / 0.85), hsl(0 100% 35% / 0.75)), url({f:uri.image(image: data.image.0)});">
            </div>
        </f:then>
        <f:else>
            <div class="absolute inset-0 gradient-fire"></div>
        </f:else>
    </f:if>

    <!-- Dekoratives Diagonal-Element -->
    <div class="absolute right-0 bottom-0 w-1/2 h-1/2 bg-gradient-to-tl from-black/30 to-transparent hidden lg:block pointer-events-none"></div>

    <div class="container relative z-10 py-16">
        <div class="max-w-3xl">

            <!-- Badge -->
            <f:if condition="{data.badge_text}">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/20 border border-white/30 text-white mb-6 backdrop-blur-sm">
                    <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                    <span class="text-sm font-medium">{data.badge_text}</span>
                </div>
            </f:if>

            <!-- Überschrift -->
            <f:if condition="{data.header}">
                <h1 class="font-heading text-4xl md:text-5xl lg:text-6xl font-bold text-white leading-tight mb-6">
                    {data.header}<f:if condition="{data.header_line2}"><span class="block text-white/90">{data.header_line2}</span></f:if>
                </h1>
            </f:if>

            <!-- Untertitel -->
            <f:if condition="{data.subheadline}">
                <p class="text-lg md:text-xl text-white/85 mb-8 max-w-2xl">
                    {data.subheadline}
                </p>
            </f:if>

            <!-- CTA-Buttons -->
            <f:if condition="{data.buttons}">
                <div class="flex flex-wrap gap-4 mb-12">
                    <f:for each="{data.buttons}" as="btn">
                        <f:if condition="{btn.button_style} == 'secondary'">
                            <f:then>
                                <f:link.typolink parameter="{btn.button_link}"
                                                 class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 border h-11 rounded-md px-8 border-background/40 bg-background/10 text-background hover:bg-background/20 hover:text-background font-heading font-semibold backdrop-blur-sm">
                                    {btn.button_text}
                                </f:link.typolink>
                            </f:then>
                            <f:else>
                                <f:link.typolink parameter="{btn.button_link}"
                                                 class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 h-11 rounded-md px-8 bg-background text-accent hover:bg-background/90 font-heading font-semibold shadow-lg">
                                    {btn.button_text}
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right ml-2 h-5 w-5"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                                </f:link.typolink>
                            </f:else>
                        </f:if>
                    </f:for>
                </div>
            </f:if>

            <!-- Statistiken -->
            <f:if condition="{data.stats}">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <f:for each="{data.stats}" as="item">
                        <div class="flex items-center gap-4 p-4 rounded-lg bg-white/15 backdrop-blur-sm border border-white/20">
                            <div class="p-3 rounded-lg bg-white/20 shrink-0">
                                <f:render partial="Icon" arguments="{icon: item.icon, class: 'text-white text-2xl'}" />
                            </div>
                            <div>
                                <p class="text-2xl font-heading font-bold text-white leading-none mb-1">{item.stat_value}</p>
                                <p class="text-sm text-white/70">{item.stat_label}</p>
                            </div>
                        </div>
                    </f:for>
                </div>
            </f:if>

        </div>
    </div>

</section>

</html>
