<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section id="c{data.uid}" class="relative min-h-[600px] md:min-h-[700px] flex items-center overflow-hidden frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">

    <!-- Background: Bild mit Farbverlauf-Overlay, sonst reiner Gradient -->
    <f:if condition="{data.image}">
        <f:then>
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
                 style="background-image: linear-gradient(135deg, hsl(0 100% 25% / 0.85), hsl(0 100% 35% / 0.75)), url({f:uri.image(image: data.image.0)});">
            </div>
        </f:then>
        <f:else>
            <div class="absolute inset-0 gradient-fire"></div>
        </f:else>
    </f:if>

    <!-- Dekoratives Diagonal-Element -->
    <div class="absolute right-0 bottom-0 w-1/2 h-1/2 bg-gradient-to-tl from-black/30 to-transparent hidden lg:block pointer-events-none"></div>

    <div class="container relative z-10 py-16">
        <div class="max-w-3xl">

            <!-- Badge -->
            <f:if condition="{data.badge_text}">
                <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/20 border border-white/30 text-white mb-6 backdrop-blur-sm">
                    <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                    <span class="text-sm font-medium">{data.badge_text}</span>
                </div>
            </f:if>

            <!-- Überschrift -->
            <f:if condition="{data.header}">
                <h1 class="font-heading text-4xl md:text-5xl lg:text-6xl font-bold text-white leading-tight mb-6">
                    {data.header}
                </h1>
            </f:if>

            <!-- Untertitel -->
            <f:if condition="{data.subheadline}">
                <p class="text-lg md:text-xl text-white/85 mb-8 max-w-2xl">
                    {data.subheadline}
                </p>
            </f:if>

            <!-- CTA-Buttons -->
            <f:if condition="{data.cta_primary_text}">
                <div class="flex flex-wrap gap-4 mb-12">
                    <f:link.typolink parameter="{data.cta_primary_link}"
                                     class="inline-flex items-center gap-2 px-6 py-3 rounded-md bg-white text-accent hover:bg-white/90 font-heading font-semibold shadow-lg no-underline transition-colors">
                        {data.cta_primary_text}
                        <i class="bi bi-arrow-right"></i>
                    </f:link.typolink>
                    <f:if condition="{data.cta_secondary_text}">
                        <f:link.typolink parameter="{data.cta_secondary_link}"
                                         class="inline-flex items-center gap-2 px-6 py-3 rounded-md border border-white/40 bg-white/10 text-white hover:bg-white/20 font-heading font-semibold backdrop-blur-sm no-underline transition-colors">
                            {data.cta_secondary_text}
                        </f:link.typolink>
                    </f:if>
                </div>
            </f:if>

            <!-- Statistiken -->
            <f:if condition="{data.stats}">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <f:for each="{data.stats}" as="item">
                        <div class="flex items-center gap-4 p-4 rounded-lg bg-white/15 backdrop-blur-sm border border-white/20">
                            <div class="p-3 rounded-lg bg-white/20 shrink-0">
                                <i class="bi bi-{item.stat_icon} text-white text-2xl"></i>
                            </div>
                            <div>
                                <p class="text-2xl font-heading font-bold text-white leading-none mb-1">{item.stat_value}</p>
                                <p class="text-sm text-white/70">{item.stat_label}</p>
                            </div>
                        </div>
                    </f:for>
                </div>
            </f:if>

        </div>
    </div>

</section>

</html>
