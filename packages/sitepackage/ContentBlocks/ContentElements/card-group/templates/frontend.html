<div id="c{data.uid}" class="frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
  <div class="container my-5">
    <f:if condition="{data.header}">
      <h2 class="mb-4">{data.header}</h2>
    </f:if>

    <f:switch expression="{data.card_layout}">

      <f:case value="quick-action">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
          <f:for each="{data.items}" as="item">
            <div class="col">
              <f:link.typolink parameter="{item.link}" class="text-decoration-none d-block h-100">
                <div class="card h-100 shadow-sm border-0">
                  <div class="card-body d-flex flex-column">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3 {f:if(condition: '{item.variant} == accent', then: 'gradient-fire', else: 'bg-primary')}" style="width:3.5rem;height:3.5rem;">
                      <i class="bi bi-{item.icon} fs-3 text-white"></i>
                    </div>
                    <h3 class="h5 card-title">{item.header}</h3>
                    <p class="card-text text-body-secondary small mb-0">{item.bodytext -> f:format.html()}</p>
                  </div>
                </div>
              </f:link.typolink>
            </div>
          </f:for>
        </div>
      </f:case>

      <f:case value="stat">
        <div class="row row-cols-2 row-cols-md-4 g-3">
          <f:for each="{data.items}" as="item">
            <div class="col">
              <div class="card h-100">
                <div class="card-body">
                  <div class="d-flex align-items-center justify-content-between mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center rounded-2 bg-primary-subtle" style="width:2.25rem;height:2.25rem;">
                      <i class="bi bi-{item.icon} text-primary-emphasis"></i>
                    </span>
                    <f:if condition="{item.stat_trend}">
                      <span class="badge bg-success-subtle text-success-emphasis rounded-pill">{item.stat_trend}</span>
                    </f:if>
                  </div>
                  <div class="fs-3 fw-bold card-title mb-0">{item.stat_value}</div>
                  <p class="card-text text-body-secondary small mb-0">{item.header}</p>
                </div>
              </div>
            </div>
          </f:for>
        </div>
      </f:case>

      <f:case value="feature">
        <div class="row row-cols-1 row-cols-md-{data.breakpoint_tablet} row-cols-xl-{data.breakpoint_desktop} g-4">
          <f:for each="{data.items}" as="item">
            <div class="col">
              <div class="card h-100">
                <div class="card-body d-flex flex-column">
                  <f:if condition="{item.badge}">
                    <span class="badge text-bg-light border rounded-pill mb-3 align-self-start">{item.badge}</span>
                  </f:if>
                  <h3 class="h5 card-title">{item.header}</h3>
                  <div class="card-text text-body-secondary small flex-grow-1">{item.bodytext -> f:format.html()}</div>
                  <f:if condition="{item.link}">
                    <f:link.typolink parameter="{item.link}" class="mt-3 d-inline-flex align-items-center gap-1 small fw-medium text-decoration-none">
                      Details <i class="bi bi-arrow-right"></i>
                    </f:link.typolink>
                  </f:if>
                </div>
              </div>
            </div>
          </f:for>
        </div>
      </f:case>

      <f:defaultCase>
        <div class="row row-cols-{data.breakpoint_mobile} row-cols-md-{data.breakpoint_tablet} row-cols-xl-{data.breakpoint_desktop} g-4">
          <f:for each="{data.items}" as="item">
            <div class="col">
              <div class="card card-color-{data.color} h-100 shadow-sm">
                <f:if condition="{item.image}">
                  <f:image image="{item.image.0}" class="card-img-top" />
                </f:if>
                <div class="card-body">
                  <f:if condition="{item.header}">
                    <h4 class="card-title">{item.header}</h4>
                  </f:if>
                  <div class="card-text">{item.bodytext -> f:format.html()}</div>
                </div>
              </div>
            </div>
          </f:for>
        </div>
      </f:defaultCase>

    </f:switch>
  </div>
</div>
