<div id="c{data.uid}" class="container accordion frame frame-{data.frame_class} frame-type-{data.CType} frame-layout-{data.layout}{f:if(condition: data.space_before_class, then: ' frame-space-before-{data.space_before_class}')}{f:if(condition: data.space_after_class, then: ' frame-space-after-{data.space_after_class}')}">
    <div class="row gy-5 row-cols-{data.breakpoint_mobile} row-cols-md-{data.breakpoint_tablet} row-cols-xl-{data.breakpoint_desktop}">
      <f:for each="{data.items}" as="item" iteration="i">
          <div class="col">
              <div class="card h-100 text-bg-{data.color}">
                  <f:if condition="{item.image}">
                      <f:image image="{item.image.0}" class="card-img-top img-fluid mb-2" />
                  </f:if>
                  <div class="card-body">
                      <h4 class="card-title">{item.header}</h4>
                      <div class="card-text">{item.bodytext->f:format.html()}</div>
                  </div>
              </div>
          </div>
      </f:for>
    </div>
</div>
