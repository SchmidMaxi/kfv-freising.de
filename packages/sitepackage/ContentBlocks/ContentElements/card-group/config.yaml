name: sitepackage/card-group
typeName: card-group
group: default
prefixFields: true
prefixType: full
basics:
  - TYPO3/Appearance
fields:
  -
    identifier: header
    useExistingField: true
  -
    identifier: card_layout
    type: Select
    renderType: selectSingle
    default: 'default'
    items:
      - label: 'Standard (Bild + Text)'
        value: default
      - label: 'Quick-Action Cards (Icon + Link)'
        value: quick-action
      - label: 'Statistik-Kacheln'
        value: stat
      - label: 'Feature-Cards (mit Badge + Link)'
        value: feature
  -
    identifier: color
    type: Select
    useExistingField: true
    renderType: selectSingle
  -
    identifier: sitepackage/breakpoints
    type: Basic
  -
    identifier: items
    type: Collection
    labelField: header
    minitems: 1
    appearance:
      collapseAll: true
      levelLinksPosition: bottom
    fields:
      - identifier: header
        type: Text
        label: 'Titel'
      - identifier: image
        type: File
        label: Bild
        maxitems: 1
      - identifier: bodytext
        type: Textarea
        enableRichtext: true
        label: 'Text / Beschreibung'
      - identifier: icon
        type: Text
        label: 'Icon (Bootstrap Icons Name)'
        placeholder: 'z.B. fire, shield-fill, calendar'
      - identifier: variant
        type: Select
        renderType: selectSingle
        default: 'accent'
        label: 'Icon-Farbe (Quick-Action)'
        items:
          - label: 'Akzent (Feuerwehr-Rot)'
            value: accent
          - label: 'Primär (Dunkel)'
            value: primary
      - identifier: badge
        type: Text
        label: 'Badge-Text (Feature)'
      - identifier: link
        type: Link
        label: 'Link (Quick-Action / Feature)'
      - identifier: stat_value
        type: Text
        label: 'Kennzahl (Statistik)'
        placeholder: 'z.B. 2.850'
      - identifier: stat_trend
        type: Text
        label: 'Trend (Statistik)'
        placeholder: 'z.B. +12%'
