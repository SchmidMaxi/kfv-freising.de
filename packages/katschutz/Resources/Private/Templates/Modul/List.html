<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Modul'}" />
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Module / Sets</h1>
        <f:link.action action="new" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i> Neues Modul</f:link.action>
    </div>
    <div class="list-group">
        <f:for each="{module}" as="m">
            <div class="list-group-item{f:if(condition: m.hidden, then: ' opacity-50')}">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <strong>{m.title}</strong><f:if condition="{m.hidden}"> <span class="badge text-bg-secondary">archiviert</span></f:if>
                        <div class="small text-body-secondary"><f:for each="{m.positionen}" as="p" iteration="i">{p.menge} × {p.artikel.title}{f:if(condition: i.isLast, else: ', ')}</f:for></div>
                    </div>
                    <span class="d-flex gap-2">
                        <f:if condition="!{m.hidden}"><f:link.action action="edit" arguments="{modul: m}" class="btn btn-sm btn-outline-secondary">Bearbeiten</f:link.action></f:if>
                        <f:form action="archive" arguments="{modul: m.uid}" method="post"><button type="submit" class="btn btn-sm btn-outline-{f:if(condition: m.hidden, then: 'secondary', else: 'danger')}">{f:if(condition: m.hidden, then: 'Reaktivieren', else: 'Archivieren')}</button></f:form>
                    </span>
                </div>
            </div>
        </f:for>
    </div>
</f:section>
</html>
