<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Modul'}" />
    <h1 class="h3 mb-3">Modul</h1>
    <f:render partial="Fehler" />
    <f:form action="create" object="{modul}" name="modul" method="post">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="kats-title" class="form-label">Bezeichnung <span class="text-danger">*</span></label>
                <f:form.textfield id="kats-title" property="title" class="form-control" required="1" />
            </div>
            <div class="col-md-6">
                <label for="kats-beschr" class="form-label">Beschreibung</label>
                <f:form.textfield id="kats-beschr" property="beschreibung" class="form-control" />
            </div>
        </div>
        <h2 class="h5">Inhalt</h2>
        <table class="table table-sm align-middle">
            <thead><tr><th>Artikel</th><th style="width: 9rem">Menge</th></tr></thead>
            <tbody>
                <f:for each="{artikelListe}" as="a">
                    <tr>
                        <td><label for="kats-inh-{a.uid}">{a.title}</label></td>
                        <td><f:form.textfield id="kats-inh-{a.uid}" type="number" name="inhalt[{a.uid}]" value="{mengen.{a.uid}}" class="form-control form-control-sm" additionalAttributes="{min: 0, placeholder: '0'}" /></td>
                    </tr>
                </f:for>
            </tbody>
        </table>
        <button type="submit" class="btn btn-primary">Anlegen</button>
        <f:link.action action="list" class="btn btn-link">Abbrechen</f:link.action>
    </f:form>
</f:section>
</html>
