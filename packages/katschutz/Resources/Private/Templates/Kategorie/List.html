<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Kategorie'}" />
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Kategorien</h1>
        <f:link.action action="new" class="btn btn-primary"><i class="bi bi-plus-lg" aria-hidden="true"></i> Neu</f:link.action>
    </div>
    <ul class="list-group">
        <f:for each="{eintraege}" as="e">
            <li class="list-group-item d-flex justify-content-between align-items-center{f:if(condition: e.hidden, then: ' opacity-50')}">
                <span>{e.title}<f:if condition="{e.hidden}"> <span class="badge text-bg-secondary">archiviert</span></f:if></span>
                <span class="d-flex gap-2">
                    <f:if condition="!{e.hidden}"><f:link.action action="edit" arguments="{kategorie: e}" class="btn btn-sm btn-outline-secondary">Bearbeiten</f:link.action></f:if>
                    <f:form action="archive" arguments="{kategorie: e.uid}" method="post"><button type="submit" class="btn btn-sm btn-outline-{f:if(condition: e.hidden, then: 'secondary', else: 'danger')}">{f:if(condition: e.hidden, then: 'Reaktivieren', else: 'Archivieren')}</button></f:form>
                </span>
            </li>
        </f:for>
    </ul>
</f:section>
</html>
