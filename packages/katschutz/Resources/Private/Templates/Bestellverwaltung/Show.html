<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Bestellverwaltung'}" />
    <f:render partial="Bestellung/Kopf" arguments="{bestellung: bestellung}" />

    <h2 class="h5">Positionen</h2>
    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead><tr><th>Artikel</th><th class="text-end">bestellt</th><th class="text-end">ausgegeben</th><th class="text-end">zurück</th><th class="text-end">draußen</th></tr></thead>
            <tbody>
                <f:for each="{positionen}" as="p">
                    <tr>
                        <td>{p.artikel.title}<f:if condition="{p.artikel.verbrauch}"> <span class="badge text-bg-light border">Verbrauch</span></f:if></td>
                        <td class="text-end">{p.bestellt}</td>
                        <td class="text-end">{p.ausgegeben}</td>
                        <td class="text-end">{p.zurueck}</td>
                        <td class="text-end">{p.draussen}</td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>

    <div class="d-flex flex-wrap gap-2 my-3">
        <f:if condition="{bestellung.status.freigebbar}">
            <f:form action="approve" arguments="{bestellung: bestellung}" method="post">
                <button type="submit" class="btn btn-success"><i class="bi bi-check-circle" aria-hidden="true"></i> Freigeben</button>
            </f:form>
        </f:if>
        <f:if condition="{bestellung.status.ausgabeErlaubt}">
            <f:link.action action="ausgabe" arguments="{bestellung: bestellung}" class="btn btn-primary"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Ausgabe buchen</f:link.action>
        </f:if>
        <f:if condition="{hatDraussen}">
            <f:link.action action="ruecknahme" arguments="{bestellung: bestellung}" class="btn btn-outline-primary"><i class="bi bi-box-arrow-in-left" aria-hidden="true"></i> Rücknahme</f:link.action>
            <f:link.action action="umbuchung" arguments="{bestellung: bestellung}" class="btn btn-outline-primary"><i class="bi bi-arrow-left-right" aria-hidden="true"></i> Umbuchen</f:link.action>
        </f:if>
        <f:if condition="{hatAusgaben}">
            <f:link.action action="lieferschein" arguments="{bestellung: bestellung}" class="btn btn-outline-secondary" target="_blank"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> Lieferschein</f:link.action>
            <f:link.action action="lieferschein" arguments="{bestellung: bestellung, art: 'ruecknahme'}" class="btn btn-outline-secondary" target="_blank"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> Rücknahmebeleg</f:link.action>
        </f:if>
        <f:if condition="{bestellung.status.ausgabeErlaubt} && !{hatDraussen}">
            <f:form action="close" arguments="{bestellung: bestellung}" method="post">
                <button type="submit" class="btn btn-outline-success"><i class="bi bi-check2-all" aria-hidden="true"></i> Abschließen</button>
            </f:form>
        </f:if>
    </div>

    <f:if condition="{bestellung.status.freigebbar} || {bestellung.status.value} == 'freigegeben'">
        <details class="mb-3">
            <summary class="text-danger">Bestellung ablehnen …</summary>
            <f:form action="reject" arguments="{bestellung: bestellung}" method="post" class="mt-2">
                <label for="kats-grund" class="form-label">Grund (wird dem Besteller angezeigt)</label>
                <f:form.textarea id="kats-grund" name="grund" class="form-control mb-2" rows="2" required="1" />
                <button type="submit" class="btn btn-danger">Ablehnen</button>
            </f:form>
        </details>
    </f:if>

    <f:render partial="Bestellung/Journal" arguments="{buchungen: buchungen}" />
</f:section>
</html>
