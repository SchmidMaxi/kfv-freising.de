<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Artikel'}" />
    <h1 class="h3 mb-3">Neuer Artikel</h1>
    <f:render partial="Fehler" />
    <f:form action="create" object="{artikel}" name="artikel" method="post" enctype="multipart/form-data">
        <f:render partial="Verwaltung/ArtikelFelder" arguments="{_all}" />
        <div class="row g-3 mt-1">
            <div class="col-md-3">
                <label for="kats-anfang" class="form-label">Anfangsbestand (nur Mengenartikel)</label>
                <f:form.textfield id="kats-anfang" type="number" name="anfangsbestand" value="0" class="form-control" additionalAttributes="{min: 0}" />
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Anlegen</button>
            <f:link.action action="list" class="btn btn-link">Abbrechen</f:link.action>
        </div>
    </f:form>
</f:section>
</html>
