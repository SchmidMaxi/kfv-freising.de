<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Artikel'}" />
    <h1 class="h3 mb-3">{artikel.title} bearbeiten</h1>
    <f:render partial="Fehler" />
    <f:form action="update" object="{artikel}" name="artikel" method="post" enctype="multipart/form-data">
        <f:render partial="Verwaltung/ArtikelFelder" arguments="{_all}" />
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <f:link.action action="show" arguments="{artikel: artikel}" class="btn btn-link">Abbrechen</f:link.action>
        </div>
    </f:form>
</f:section>
</html>
