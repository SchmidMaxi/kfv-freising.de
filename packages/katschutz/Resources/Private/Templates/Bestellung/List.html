<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Bestellung/Nav" arguments="{aktiv: 'meine'}" />
    <h1 class="h3 mb-3">Meine Bestellungen</h1>
    <f:if condition="{bestellungen -> f:count()}">
        <f:then>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead><tr><th>Nr.</th><th>Datum</th><th>Feuerwehr</th><th>Anlass</th><th>Status</th></tr></thead>
                    <tbody>
                        <f:for each="{bestellungen}" as="bestellung">
                            <tr>
                                <td><f:link.action action="show" arguments="{bestellung: bestellung}">{bestellung.nummer}</f:link.action></td>
                                <td><f:format.date format="d.m.Y H:i">{bestellung.crdate}</f:format.date></td>
                                <td>{bestellung.feuerwehr.name}</td>
                                <td>{bestellung.anlass}</td>
                                <td><f:render partial="Status" arguments="{bestellung: bestellung}" /></td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>
        </f:then>
        <f:else><p class="text-body-secondary">Noch keine Bestellungen.</p></f:else>
    </f:if>
</f:section>
</html>
