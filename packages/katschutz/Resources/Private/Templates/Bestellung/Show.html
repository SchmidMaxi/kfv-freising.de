<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Bestellung/Nav" arguments="{aktiv: 'meine'}" />
    <f:render partial="Bestellung/Kopf" arguments="{bestellung: bestellung}" />
    <h2 class="h5">Positionen</h2>
    <ul class="list-group mb-3">
        <f:for each="{bestellung.positionen}" as="p">
            <li class="list-group-item d-flex justify-content-between">
                <span>{p.artikel.title}<f:if condition="{p.modul}"> <span class="small text-body-secondary">(aus {p.modul.title})</span></f:if></span>
                <span>{p.menge} {p.artikel.einheit}</span>
            </li>
        </f:for>
    </ul>
    <f:render partial="Bestellung/Journal" arguments="{buchungen: buchungen}" />
    <div class="d-flex flex-wrap gap-2 mt-3">
        <f:if condition="{bestellung.status.stornierbar}">
            <f:form action="cancel" arguments="{bestellung: bestellung}" method="post" additionalAttributes="{onsubmit: 'return confirm(\'Bestellung wirklich stornieren?\')'}">
                <button type="submit" class="btn btn-outline-danger"><i class="bi bi-x-circle" aria-hidden="true"></i> Stornieren</button>
            </f:form>
        </f:if>
        <f:if condition="{buchungen -> f:count()}">
            <f:link.action action="lieferschein" arguments="{bestellung: bestellung}" class="btn btn-outline-secondary" target="_blank"><i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> Lieferschein</f:link.action>
        </f:if>
        <f:link.action action="list" class="btn btn-link">Zurück</f:link.action>
    </div>
</f:section>
</html>
