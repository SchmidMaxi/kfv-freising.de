<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Verwaltung/Nav" arguments="{aktiv: 'Artikel'}" />
    <h1 class="h3 mb-3">{einzelstueck.artikel.title} {einzelstueck.inventarnummer} bearbeiten</h1>
    <f:render partial="Fehler" />
    <f:form action="update" object="{einzelstueck}" name="einzelstueck" method="post">
        <f:render partial="Verwaltung/EinzelstueckFelder" arguments="{einzelstueck: einzelstueck, lagerorte: lagerorte, objektName: 'einzelstueck'}" />
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Speichern</button>
            <f:link.action controller="Artikel" action="show" arguments="{artikel: einzelstueck.artikel}" class="btn btn-link">Abbrechen</f:link.action>
        </div>
    </f:form>
</f:section>
</html>
