<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Katschutz" />
<f:section name="main">
    <f:render partial="Bestellung/Nav" arguments="{aktiv: 'katalog'}" />
    <f:form action="list" method="get" class="row g-2 mb-4">
        <div class="col-md-4">
            <label for="kats-kat" class="visually-hidden">Kategorie</label>
            <f:form.select id="kats-kat" name="kategorie" value="{kategorie}" class="form-select" options="{kategorien}" optionValueField="uid" optionLabelField="title" prependOptionLabel="Alle Kategorien" prependOptionValue="0" />
        </div>
        <div class="col-md-6">
            <label for="kats-suche" class="visually-hidden">Suche</label>
            <f:form.textfield id="kats-suche" name="suche" value="{suche}" class="form-control" placeholder="Suche nach Artikel …" />
        </div>
        <div class="col-md-2 d-grid"><button class="btn btn-outline-primary" type="submit"><i class="bi bi-search" aria-hidden="true"></i> Filtern</button></div>
    </f:form>

    <f:for each="{gruppen}" as="zeilen" key="titel">
        <h2 class="h4 mt-4 mb-3">{titel}</h2>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
            <f:for each="{zeilen}" as="zeile">
                <div class="col">
                    <div class="card h-100">
                        <f:if condition="{zeile.artikel.erstesBild}">
                            <f:image image="{zeile.artikel.erstesBild}" width="600c" height="300c" class="card-img-top" alt="{zeile.artikel.title}" />
                        </f:if>
                        <div class="card-body d-flex flex-column">
                            <h3 class="h6 card-title">
                                <f:link.action action="show" arguments="{artikel: zeile.artikel}" class="stretched-link text-decoration-none">{zeile.artikel.title}</f:link.action>
                            </h3>
                            <p class="card-text small text-body-secondary">{zeile.artikel.beschreibung -> f:format.crop(maxCharacters: 140)}</p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="badge text-bg-{f:if(condition: zeile.verfuegbar, then: 'success', else: 'danger')}">{zeile.verfuegbar} {zeile.artikel.einheit} verfügbar</span>
                                <f:if condition="{zeile.artikel.lagerort}"><span class="small text-body-secondary"><i class="bi bi-geo-alt" aria-hidden="true"></i> {zeile.artikel.lagerort.title}</span></f:if>
                            </div>
                        </div>
                    </div>
                </div>
            </f:for>
        </div>
    </f:for>
    <f:if condition="{gruppen -> f:count()} == 0">
        <p class="text-body-secondary">Keine Artikel gefunden.</p>
    </f:if>
</f:section>
</html>
