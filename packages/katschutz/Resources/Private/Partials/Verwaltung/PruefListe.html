<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{stuecke -> f:count()}">
    <f:then>
        <div class="table-responsive">
            <table class="table table-sm align-middle">
                <thead><tr><th>Artikel</th><th>Inventar-Nr.</th><th>Zustand</th><th>fällig</th><th></th></tr></thead>
                <tbody>
                    <f:for each="{stuecke}" as="s">
                        <tr>
                            <td><f:link.action controller="Artikel" action="show" arguments="{artikel: s.artikel}">{s.artikel.title}</f:link.action></td>
                            <td>{s.inventarnummer}</td>
                            <td>{s.zustand}</td>
                            <td>
                                <f:if condition="{s.naechstePruefung}">
                                    <f:then><span class="{f:if(condition: s.pruefungUeberfaellig, then: 'text-danger fw-semibold')}"><f:format.date format="d.m.Y">{s.naechstePruefung}</f:format.date></span></f:then>
                                    <f:else><span class="text-danger">kein Termin</span></f:else>
                                </f:if>
                            </td>
                            <td class="text-end"><f:link.action controller="Pruefung" action="new" arguments="{einzelstueck: s}" class="btn btn-sm btn-outline-primary">Prüfung erfassen</f:link.action></td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:then>
    <f:else><p class="text-body-secondary">Keine.</p></f:else>
</f:if>
</html>
