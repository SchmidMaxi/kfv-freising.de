<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{fehler}">
    <div class="alert alert-danger" role="alert">
        <strong>Bitte prüfen:</strong>
        <ul class="mb-0">
            <f:for each="{fehler}" as="f"><li>{f}</li></f:for>
        </ul>
    </div>
</f:if>
<f:form.validationResults>
    <f:if condition="{validationResults.flattenedErrors}">
        <div class="alert alert-danger" role="alert">
            <ul class="mb-0">
                <f:for each="{validationResults.flattenedErrors}" as="errors" key="feld">
                    <f:for each="{errors}" as="error"><li>{feld}: {error.message}</li></f:for>
                </f:for>
            </ul>
        </div>
    </f:if>
</f:form.validationResults>
</html>
