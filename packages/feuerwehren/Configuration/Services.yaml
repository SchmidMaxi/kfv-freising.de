services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  Schmid\Feuerwehren\:
    resource: '../Classes/*'
  Schmid\Feuerwehren\Command\TilesPrefetchCommand:
    tags:
      - name: 'console.command'
        command: 'feuerwehren:tiles:prefetch'
        description: 'Prefetch map tiles into a local directory for given bbox & zooms'