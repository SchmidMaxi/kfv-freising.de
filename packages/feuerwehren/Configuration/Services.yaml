services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Schmid\Feuerwehren\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Console Commands
  Schmid\Feuerwehren\Command\TilesPrefetchCommand:
    tags:
      - name: 'console.command'
        command: 'feuerwehren:tiles:prefetch'
        description: 'Prefetch XYZ tiles into var/tiles for a given BBOX and zoom levels'

  Schmid\Feuerwehren\Command\MbtilesFetchCommand:
    tags:
      - name: 'console.command'
        command: 'feuerwehren:mbtiles:fetch'
        description: 'Download MBTiles file from URL with optional checksum validation'

  # Controllers (must be public for TYPO3 instantiation)
  Schmid\Feuerwehren\Controller\PersonController:
    public: true

  Schmid\Feuerwehren\Controller\FeuerwehrController:
    public: true

  Schmid\Feuerwehren\Controller\JubilaeumController:
    public: true

  Schmid\Feuerwehren\Controller\VectorTileController:
    public: true

  # Middleware (must be public for TYPO3 middleware chain)
  Schmid\Feuerwehren\Middleware\ApiGatewayMiddleware:
    public: true