<f:layout name="Default" />
<f:section name="main">

  <div class="container py-8 max-w-2xl">
    <h1 class="mb-2 font-heading text-3xl font-bold text-foreground">
      <f:if condition="{person.feUser}">{person.feUser.name}<f:else>{person.title}</f:else></f:if>
    </h1>
    <p class="mb-6 text-muted-foreground">
      <span class="font-medium text-foreground">Funktion:</span> {person.title}
    </p>

    <f:if condition="{person.gemeinde}">
      <div class="mb-6 rounded-lg border border-border bg-card p-5">
        <h3 class="mb-3 font-heading text-base font-semibold text-foreground">Zugeordnete Gemeinden</h3>
        <ul class="space-y-1 text-sm">
          <f:for each="{person.gemeinde}" as="gemeinde">
            <li class="flex items-center gap-2 text-foreground">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>{gemeinde.name}
            </li>
          </f:for>
        </ul>
      </div>
    </f:if>

    <f:link.action action="list"
                   class="inline-flex items-center gap-2 gradient-fire rounded-lg px-4 py-2 font-medium text-white no-underline transition-opacity hover:opacity-90">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Zurück zum Organigramm
    </f:link.action>
  </div>

</f:section>
