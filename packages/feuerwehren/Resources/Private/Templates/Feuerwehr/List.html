<f:layout name="Default" />
<f:section name="main">

  <f:asset.css identifier="feuerwehren-map" href="EXT:feuerwehren/Resources/Public/Css/feuerwehren-map.css" />

  <f:if condition="{compact}">
    <f:then>
      <div class="feuerwehren-karte-wrap feuerwehren-karte-wrap--compact card shadow-sm p-3">
        <div id="map" class="rounded-3 overflow-hidden"></div>
        <f:link.typolink parameter="45" class="btn btn-outline-primary w-100 mt-3">
          Feuerwehr finden
        </f:link.typolink>
      </div>
    </f:then>
    <f:else>
      <div class="feuerwehren-karte-wrap">
        <div class="container py-4">

          <div id="fzFilters" class="mb-4 rounded border bg-body p-4">
            <h3 class="mb-3 fs-6 fw-semibold">
              Filter nach Fahrzeugtyp
            </h3>
            <div class="mb-3 d-flex flex-wrap gap-2">
              <input class="btn-check" autocomplete="off" type="radio" id="mode_and" name="mode" value="and" checked>
              <label class="btn btn-outline-secondary rounded-pill btn-sm" for="mode_and">
                Alle müssen passen (UND)
              </label>
              <input class="btn-check" autocomplete="off" type="radio" id="mode_or" name="mode" value="or">
              <label class="btn btn-outline-secondary rounded-pill btn-sm" for="mode_or">
                Mind. eins passt (ODER)
              </label>
            </div>
            <hr class="mb-3">
            <f:if condition="{fahrzeugkategorien}">
              <div class="d-flex flex-wrap gap-2">
                <f:for each="{fahrzeugkategorien}" as="kategorie">
                  <input class="btn-check" autocomplete="off" type="checkbox"
                         id="fz-{kategorie.uid}" name="fz[]" value="{kategorie.uid}">
                  <label class="btn btn-outline-primary rounded-pill btn-sm" for="fz-{kategorie.uid}">
                    {kategorie.title}
                  </label>
                </f:for>
              </div>
            </f:if>
          </div>

          <!-- Layer-Toggles -->
          <div id="layerToggles" class="d-flex flex-wrap gap-4 py-2 small">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="toggle-gemeinden" checked>
              <label class="form-check-label" for="toggle-gemeinden">Gemeinden</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="toggle-kbm">
              <label class="form-check-label" for="toggle-kbm">KBM-Bereiche</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="toggle-kbi">
              <label class="form-check-label" for="toggle-kbi">KBI-Bereiche</label>
            </div>
          </div>
        </div>

        <!-- Karte + Liste -->
        <div class="d-flex flex-column flex-md-row">
          <div class="col-md-4 col-xl-3">
            <div id="fwList" class="overflow-y-auto border-end bg-body"></div>
          </div>
          <div class="col-md-8 col-xl-9">
            <div id="map"></div>
          </div>
        </div>
      </div>
    </f:else>
  </f:if>

  <f:asset.script identifier="turf" src="EXT:feuerwehren/Resources/Public/JavaScript/turf.min.js?v=1759900000" />
  <f:asset.script identifier="maplibre" src="EXT:feuerwehren/Resources/Public/JavaScript/maplibre-gl.js?v=1759900000" />
  <f:asset.script identifier="feuerwehren-map" src="EXT:feuerwehren/Resources/Public/JavaScript/map-feuerwehren.js?v=1785790000" />
  <f:asset.css identifier="maplibre" href="EXT:feuerwehren/Resources/Public/Css/maplibre-gl.css" />

</f:section>
