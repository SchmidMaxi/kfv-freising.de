<div class="org-item org-item--{area.type}">
    <div class="org-item-title">{area.title}</div>
    <div class="org-item-person">
        <f:if condition="{area.person}">
            <f:then>
                <f:link.action action="show" controller="Person" pluginName="Organigramm" arguments="{person: area.person}">
                    {area.person.title}
                </f:link.action>
            </f:then>
            <f:else>
                <span class="text-muted">Nicht besetzt</span>
            </f:else>
        </f:if>
    </div>
</div>
