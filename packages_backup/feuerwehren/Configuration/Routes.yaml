# EXT:feuerwehren/Configuration/Routes.yaml

# Diagnose (Ping)
feuerwehren_ping:
  path: '/__feuerwehren/ping'
  controller: 'Schmid\\Feuerwehren\\Controller\\Api\\SearchController::ping'
  methods: [GET]
  access: 'public'

# API: Suche (vormals type=171001)
feuerwehren_api_search:
  path: '/api/feuerwehren/search'
  controller: 'Schmid\\Feuerwehren\\Controller\\Api\\SearchController::search'
  methods: [GET]
  access: 'public'

# API: Overlays (vormals type=171002)
feuerwehren_api_overlays:
  path: '/api/feuerwehren/overlays'
  controller: 'Schmid\\Feuerwehren\\Controller\\Api\\OverlaysController::overlays'
  methods: [GET]
  access: 'public'

# Tiles (PSR-15 – 171003 wird damit obsolet)
feuerwehren_tiles:
  path: '/_tiles/{z}/{x}/{y}.{format}'
  controller: 'Schmid\\Feuerwehren\\Controller\\TileController::tileAction'
  requirements:
    z: '\d+'
    x: '\d+'
    y: '\d+'
    format: 'png|jpg|jpeg|webp'
  methods: [GET]
  access: 'public'

# VectorTiles
feuerwehren_vt:
  path: '/_vt/{z}/{x}/{y}.pbf'
  controller: 'Schmid\\Feuerwehren\\Controller\\VectorTileController::pbfAction'
  requirements:
    z: '\d+'
    x: '\d+'
    y: '\d+'
  methods: [GET]
  access: 'public'
