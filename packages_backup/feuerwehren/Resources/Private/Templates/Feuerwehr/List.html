<f:layout name="Default" />
<f:section name="main">
    <h1>Feuerwehrkarte (Vektor)</h1>

    <f:debug>{_all}</f:debug>

    <style>
        .fw-wrap { display:grid; grid-template-columns: 380px 1fr; gap:12px; }
        .fw-filters { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
        .fw-filters fieldset { border:0; padding:0; margin:0; display:flex; gap:8px; align-items:center; }
        .fw-list { height: 70vh; min-width:300px; overflow:auto; border:1px solid #ddd; border-radius:8px; padding:8px; }
        .fw-item { padding:6px 4px; border-bottom:1px solid #eee; cursor:pointer; }
        .fw-item:last-child { border-bottom:none; }
        #map { height: 70vh; border:1px solid #ddd; border-radius:8px; }
        .legend { font-size:12px; color:#666; }
    </style>

    <div class="filters">
        <fieldset>
            <legend class="legend">Fahrzeugkategorien:</legend>
            <f:for each="{fahrzeugkategorien}" as="kat">
                <label>
                    <input type="checkbox" name="fz" value="{kat.uid}" />
                    <f:if condition="{kat.title}">
                        <f:then>{kat.title}</f:then>
                        <f:else>{kat.name}</f:else>
                    </f:if>
                </label>
            </f:for>
        </fieldset>

        <fieldset>
            <legend class="legend">Logik:</legend>
            <label><input type="radio" name="mode" value="and" checked="checked" /> AND</label>
            <label><input type="radio" name="mode" value="or" /> OR</label>
        </fieldset>

        <fieldset>
            <legend class="legend">Ebenen:</legend>
            <label><input id="toggle-gemeinden" type="checkbox" checked="checked" /> Gemeinden</label>
            <label><input id="toggle-kbm" type="checkbox" /> KBM-Bereiche</label>
            <label><input id="toggle-kbi" type="checkbox" /> KBI-Bereiche</label>
        </fieldset>
    </div>


    <div class="fw-container d-flex">
        <div class="fw-list" id="fwList"></div>
        <div id="map" class="w-100"></div>
    </div>

    <!-- Konfiguration für das externe JS -->
    <script id="fw-map-config" type="application/json">
        {mapConfig -> f:format.json()}
    </script>


    <f:asset.css identifier="maplibre-gl" href="EXT:feuerwehren/Resources/Public/Css/maplibre-gl.css" />
    <f:asset.script identifier="maplibre-gl" src="EXT:feuerwehren/Resources/Public/JavaScript/maplibre-gl.js" />
    <f:asset.script identifier="turf" src="EXT:feuerwehren/Resources/Public/JavaScript/turf.min.js" />
    <f:asset.script identifier="feuerwehren-map" src="EXT:feuerwehren/Resources/Public/JavaScript/map-feuerwehren.js" />
</f:section>
